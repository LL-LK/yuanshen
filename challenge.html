<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
    <title>原神数学冒险 - 30天闯关计划</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary-gold: #C8A95B;
            --primary-gold-light: #E8D5A3;
            --primary-gold-dark: #8B7355;
            --bg-dark: #0D0B1A;
            --bg-darker: #07060F;
            --bg-card: rgba(20, 18, 40, 0.9);
            --mondstadt: #74C2A1;
            --liyue: #D4B863;
            --inazuma: #A85AF5;
            --fontaine: #4CC2F0;
            --sumeru: #7BC94A;
            --text-primary: #E8E0D0;
            --text-secondary: #9B9588;
            --border-gold: linear-gradient(135deg, #C8A95B, #8B7355, #C8A95B);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background: 
                radial-gradient(ellipse at top, rgba(100, 80, 180, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at bottom, rgba(40, 30, 80, 0.3) 0%, transparent 50%),
                var(--bg-dark);
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #fff, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                radial-gradient(2px 2px at 130px 80px, rgba(255,255,255,0.6), transparent),
                radial-gradient(1px 1px at 160px 120px, #fff, transparent),
                radial-gradient(2px 2px at 200px 50px, rgba(255,255,255,0.7), transparent),
                radial-gradient(1px 1px at 250px 160px, #fff, transparent),
                radial-gradient(2px 2px at 300px 90px, rgba(255,255,255,0.5), transparent);
            background-size: 350px 200px;
            animation: twinkle 5s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .gold-border {
            border: 2px solid;
            border-image: var(--border-gold) 1;
            background: var(--bg-card);
            box-shadow: 0 0 20px rgba(200, 169, 91, 0.1), inset 0 0 20px rgba(200, 169, 91, 0.05);
        }

        .gold-border-glow {
            position: relative;
        }

        .gold-border-glow::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(135deg, #C8A95B, #E8D5A3, #C8A95B);
            border-radius: inherit;
            z-index: -1;
            opacity: 0.6;
            filter: blur(8px);
        }

        .btn-gold {
            background: linear-gradient(135deg, #C8A95B, #8B7355);
            color: #fff;
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            box-shadow: 0 4px 15px rgba(200, 169, 91, 0.3);
        }

        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(200, 169, 91, 0.5);
        }

        .btn-gold:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .day-card {
            background: rgba(20, 18, 40, 0.9);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .day-card.unlocked:hover {
            transform: translateY(-4px);
        }

        .day-card.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .day-card.completed {
            border: 2px solid var(--primary-gold);
        }

        .nation-mondstadt { border-left: 4px solid var(--mondstadt); }
        .nation-liyue { border-left: 4px solid var(--liyue); }
        .nation-inazuma { border-left: 4px solid var(--inazuma); }
        .nation-fontaine { border-left: 4px solid var(--fontaine); }
        .nation-sumeru { border-left: 4px solid var(--sumeru); }

        .option-btn {
            background: rgba(40, 35, 70, 0.8);
            border: 2px solid rgba(200, 169, 91, 0.3);
            padding: 16px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            width: 100%;
            color: var(--text-primary);
            font-size: 15px;
        }

        .option-btn:hover:not(.disabled) {
            border-color: var(--primary-gold);
            background: rgba(60, 50, 100, 0.8);
        }

        .option-btn.correct {
            border-color: #4CAF50;
            background: rgba(76, 175, 80, 0.2);
        }

        .option-btn.wrong {
            border-color: #f44336;
            background: rgba(244, 67, 54, 0.2);
        }

        .option-btn.disabled {
            cursor: not-allowed;
        }

        .star {
            color: var(--primary-gold);
            text-shadow: 0 0 10px rgba(200, 169, 91, 0.5);
        }

        .star.empty {
            color: #3a3a4a;
            text-shadow: none;
        }

        .progress-bar {
            height: 8px;
            background: rgba(200, 169, 91, 0.2);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-gold-dark), var(--primary-gold-light));
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-content {
            background: var(--bg-card);
            border-radius: 16px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .resource-icon {
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .primogem {
            background: linear-gradient(135deg, #6B8CE8, #4A6FD4);
        }

        .mora {
            background: linear-gradient(135deg, #D4B863, #B8963E);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .animate-fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        .animate-pulse-gold {
            animation: pulse 2s ease-in-out infinite;
        }

        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        .nation-header {
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-weight: bold;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .difficulty-badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .difficulty-basic {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
        }

        .difficulty-advanced {
            background: rgba(255, 152, 0, 0.2);
            color: #FF9800;
        }

        .difficulty-challenge {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
        }

        .constellation-card {
            background: rgba(168, 90, 245, 0.1);
            border: 1px solid rgba(168, 90, 245, 0.3);
            border-radius: 10px;
            padding: 12px;
            transition: all 0.3s ease;
        }

        .constellation-card.unlocked {
            background: rgba(168, 90, 245, 0.2);
            border-color: var(--inazuma);
            box-shadow: 0 0 15px rgba(168, 90, 245, 0.3);
        }

        .constellation-card.locked {
            opacity: 0.4;
        }

        .quest-card {
            background: rgba(20, 18, 40, 0.9);
            border-radius: 10px;
            padding: 14px;
            border-left: 3px solid var(--primary-gold);
        }

        .quest-card.completed {
            border-left-color: #4CAF50;
            opacity: 0.7;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-darker);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary-gold-dark);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-gold);
        }

        .tab-btn {
            padding: 10px 20px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 16px;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            color: var(--primary-gold);
            border-bottom-color: var(--primary-gold);
        }

        .explain-box {
            background: rgba(30, 25, 50, 0.9);
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
            border-left: 3px solid var(--primary-gold);
        }

        .countdown-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #f44336;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== 新增趣味化动画 ===== */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        @keyframes correctPulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(76,175,80,0.7); }
            50% { transform: scale(1.02); box-shadow: 0 0 0 15px rgba(76,175,80,0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(76,175,80,0); }
        }

        @keyframes wrongShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        @keyframes comboFloat {
            0% { opacity: 0; transform: translateY(0) scale(0.5); }
            20% { opacity: 1; transform: translateY(-20px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-80px) scale(0.8); }
        }

        @keyframes particleBurst {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes starPop {
            0% { transform: scale(0) rotate(-180deg); opacity: 0; }
            50% { transform: scale(1.3) rotate(10deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 5px rgba(200,169,91,0.3); }
            50% { box-shadow: 0 0 20px rgba(200,169,91,0.6), 0 0 40px rgba(200,169,91,0.2); }
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes fadeScale {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .shake { animation: shake 0.5s ease; }
        .correct-pulse { animation: correctPulse 0.6s ease; }
        .wrong-shake { animation: wrongShake 0.5s ease; }
        .combo-popup {
            position: fixed;
            top: 30%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.5rem;
            font-weight: bold;
            color: #FF9800;
            text-shadow: 0 0 20px rgba(255,152,0,0.8), 0 2px 4px rgba(0,0,0,0.5);
            z-index: 200;
            pointer-events: none;
            animation: comboFloat 1.2s ease forwards;
        }
        .combo-popup.perfect { color: #FFD700; text-shadow: 0 0 30px rgba(255,215,0,1), 0 0 60px rgba(255,215,0,0.5); }
        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            animation: particleBurst 0.8s ease forwards;
        }
        .day-card.animate-in { animation: slideUp 0.5s ease forwards; opacity: 0; }
        .day-card.unlocked:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 8px 25px rgba(200,169,91,0.3);
        }
        .day-card.completed {
            border: 2px solid var(--primary-gold);
            animation: glow 2s ease-in-out infinite;
        }
        .option-btn {
            position: relative;
            overflow: hidden;
        }
        .option-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
            transition: left 0.5s ease;
        }
        .option-btn:hover:not(.disabled)::before { left: 100%; }
        .option-btn:active:not(.disabled) { transform: scale(0.98); }
        .option-btn.correct {
            animation: correctPulse 0.6s ease;
        }
        .option-btn.wrong {
            animation: wrongShake 0.5s ease;
        }
        .star-pop { animation: starPop 0.5s ease forwards; }
        .question-enter { animation: fadeScale 0.3s ease; }
        .combo-display {
            display: flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, rgba(255,152,0,0.2), rgba(255,87,34,0.1));
            border: 1px solid rgba(255,152,0,0.4);
            border-radius: 20px;
            padding: 4px 14px;
            font-size: 14px;
            font-weight: bold;
            color: #FF9800;
        }
        .combo-display.hot {
            background: linear-gradient(135deg, rgba(255,215,0,0.25), rgba(255,152,0,0.15));
            border-color: #FFD700;
            color: #FFD700;
            box-shadow: 0 0 15px rgba(255,215,0,0.3);
        }
        .sound-toggle {
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .sound-toggle:hover { background: rgba(255,255,255,0.1); }
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-darker);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .loading-overlay.hidden { opacity: 0; pointer-events: none; }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(200,169,91,0.2);
            border-top-color: var(--primary-gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .progress-fill { will-change: width; }
        .stars { will-change: opacity; }
        .btn-gold { will-change: transform; }
    </style>
</head>
<body>
    <div id="loadingOverlay" class="loading-overlay">
        <div class="text-center">
            <div class="loading-spinner mx-auto mb-4"></div>
            <p style="color: var(--primary-gold); font-weight: bold;">正在传送至秘境...</p>
        </div>
    </div>
    <div class="starfield">
        <div class="stars"></div>
    </div>

    <div id="app" class="relative z-10 min-h-screen">
        <header class="sticky top-0 z-50 gold-border border-t-0 border-x-0">
            <div class="max-w-6xl mx-auto px-4 py-3">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <a href="index.html" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm transition hover:bg-white/10" style="color: var(--text-secondary); border: 1px solid rgba(255,255,255,0.1);">
                            <i data-lucide="book-open" class="w-4 h-4"></i>
                            <span class="hidden sm:inline">返回图鉴</span>
                        </a>
                        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-purple-500 to-blue-600 flex items-center justify-center animate-pulse-gold">
                            <i data-lucide="sparkles" class="w-6 h-6 text-yellow-300"></i>
                        </div>
                        <div>
                            <h1 class="text-lg md:text-xl font-bold" style="color: var(--primary-gold-light);">30天闯关试炼</h1>
                            <p class="text-xs" style="color: var(--text-secondary);">冒险等阶 <span id="adventureRank">1</span></p>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="flex items-center gap-2 bg-black/30 px-3 py-1.5 rounded-full">
                            <div class="resource-icon mora">
                                <i data-lucide="coins" class="w-3 h-3 text-yellow-900"></i>
                            </div>
                            <span class="text-sm font-bold" id="moraCount">0</span>
                        </div>
                        <div class="flex items-center gap-2 bg-black/30 px-3 py-1.5 rounded-full">
                            <div class="resource-icon primogem">
                                <i data-lucide="gem" class="w-3 h-3 text-white"></i>
                            </div>
                            <span class="text-sm font-bold" id="primogemCount">0</span>
                        </div>
                        <button onclick="showAchievements()" class="p-2 rounded-lg hover:bg-white/10 transition relative">
                            <i data-lucide="star" class="w-5 h-5" style="color: var(--primary-gold);"></i>
                            <span id="achievementBadge" class="countdown-badge hidden">0</span>
                        </button>
                    </div>
                </div>
                <div class="mt-2">
                    <div class="flex items-center justify-between text-xs mb-1">
                        <span style="color: var(--text-secondary);">冒险阅历</span>
                        <span style="color: var(--primary-gold);"><span id="currentExp">0</span>/<span id="nextRankExp">100</span></span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="expProgress" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </header>

        <main class="max-w-6xl mx-auto px-4 py-6">
            <div class="flex gap-2 mb-6 overflow-x-auto pb-2">
                <button class="tab-btn active" onclick="switchTab('calendar')" id="tabCalendar">
                    <i data-lucide="calendar" class="w-4 h-4 inline mr-1"></i>冒险关卡
                </button>
                <button class="tab-btn" onclick="switchTab('daily')" id="tabDaily">
                    <i data-lucide="clipboard-list" class="w-4 h-4 inline mr-1"></i>每日委托
                </button>
                <button class="tab-btn" onclick="switchTab('constellation')" id="tabConstellation">
                    <i data-lucide="zap" class="w-4 h-4 inline mr-1"></i>命之座
                </button>
            </div>

            <div id="calendarView">
                <div class="text-center mb-8">
                    <h2 class="text-2xl md:text-3xl font-bold mb-2" style="color: var(--primary-gold-light);">30天数学冒险之旅</h2>
                    <p style="color: var(--text-secondary);">完成每日挑战，征服提瓦特大陆的数学秘境！</p>
                </div>

                <div id="nationSections"></div>
            </div>

            <div id="dailyView" class="hidden">
                <div class="text-center mb-6">
                    <h2 class="text-2xl font-bold mb-2" style="color: var(--primary-gold-light);">每日委托</h2>
                    <p style="color: var(--text-secondary);">完成委托获取额外奖励</p>
                </div>
                <div id="dailyQuests" class="grid gap-4 md:grid-cols-2"></div>
            </div>

            <div id="constellationView" class="hidden">
                <div class="text-center mb-6">
                    <h2 class="text-2xl font-bold mb-2" style="color: var(--primary-gold-light);">命之座</h2>
                    <p style="color: var(--text-secondary);">解锁命之座获得永久加成</p>
                </div>
                <div id="constellationList" class="grid gap-4 md:grid-cols-2 lg:grid-cols-3"></div>
            </div>
        </main>
    </div>

    <div id="quizModal" class="modal-overlay hidden">
        <div class="modal-content gold-border p-6">
            <div class="flex items-center justify-between mb-4">
                <div>
                    <h3 class="text-xl font-bold" id="quizTitle">Day 1 - 集合与逻辑</h3>
                    <p class="text-sm" style="color: var(--text-secondary);">第 <span id="currentQuestionNum">1</span>/5 题</p>
                </div>
                <div class="flex items-center gap-2">
                    <div id="comboDisplay" class="combo-display hidden">
                        <i data-lucide="flame" class="w-4 h-4"></i>
                        <span id="comboCount">0</span>连击
                    </div>
                    <span id="difficultyBadge" class="difficulty-badge difficulty-basic">基础</span>
                    <button id="soundToggle" onclick="toggleSound()" class="sound-toggle" title="音效开关">
                        <i data-lucide="volume-2" class="w-5 h-5"></i>
                    </button>
                    <button onclick="closeQuiz()" class="p-2 hover:bg-white/10 rounded-lg transition">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
            <div class="progress-bar mb-6">
                <div class="progress-fill" id="quizProgress" style="width: 20%"></div>
            </div>
            <div id="questionContainer" class="mb-6">
                <div class="text-lg mb-6 leading-relaxed" id="questionText"></div>
                <div id="optionsContainer" class="space-y-3"></div>
            </div>
            <div id="explanationBox" class="explain-box hidden">

        /* ===== 音效系统（Web Audio API，无需外部文件） ===== */
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
            }
        }

        function playTone(freq, duration, type = 'sine', volume = 0.15) {
            if (!soundEnabled || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        /* ===== 选项洗牌（Fisher-Yates） ===== */
        function shuffleOptions(q) {
            const correctText = q.options[q.answer];
            const shuffled = [...q.options];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            const newAnswer = shuffled.indexOf(correctText);
            return { ...q, options: shuffled, answer: newAnswer };
        }

                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-3">
                        ${daysInNation.map(d => renderDayCard(d, nation.color, cardIndex++)).join('')}
                    </div>
                `;
                container.appendChild(nationDiv);
            });
            
            lucide.createIcons();
        }

        function renderDayCard(day, nationColor, index) {
            const isCompleted = gameState.completedDays.includes(day.day);
            const isUnlocked = day.day === 1 || gameState.completedDays.includes(day.day - 1);
            const starRecord = gameState.starRecords.find(s => s.day === day.day);
            const stars = starRecord ? starRecord.stars : 0;
            
            const difficultyClass = day.difficulty === 'basic' ? 'difficulty-basic' : 
                                    day.difficulty === 'advanced' ? 'difficulty-advanced' : 'difficulty-challenge';
            const difficultyText = day.difficulty === 'basic' ? '基础' : day.difficulty === 'advanced' ? '进阶' : '挑战';
            
            return `
                <div class="day-card nation-${day.nation} ${isCompleted ? 'completed' : ''} ${isUnlocked ? 'unlocked' : 'locked'} animate-in"
                     style="animation-delay: ${index * 0.05}s;"
                     onclick="${isUnlocked ? `startQuiz(${day.day})` : ''}">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm font-bold" style="color: ${nationColor};">Day ${day.day}</span>
                        ${!isUnlocked ? '<i data-lucide="lock" class="w-4 h-4" style="color: var(--text-secondary);"></i>' : 
                          isCompleted ? '<i data-lucide="check-circle" class="w-4 h-4" style="color: #4CAF50;"></i>' :
                          '<i data-lucide="play-circle" class="w-4 h-4" style="color: var(--primary-gold);"></i>'}
                    </div>
                    <p class="text-sm font-medium mb-2" style="color: var(--text-primary);">${day.title}</p>
                    <div class="flex items-center justify-between">
                        <span class="difficulty-badge ${difficultyClass}">${difficultyText}</span>
                        <div class="flex gap-0.5">
                            ${[1,2,3].map(i => `<i data-lucide="star" class="w-3 h-3 ${i <= stars ? 'star fill-current' : 'star empty'}"></i>`).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderDailyQuests() {
            const container = document.getElementById('dailyQuests');
            container.innerHTML = gameState.dailyQuests.map(quest => {
                const progress = Math.min(quest.progress, quest.target);
                const progressPercent = (progress / quest.target) * 100;
                return `
                    <div class="quest-card ${quest.claimed ? 'completed' : ''}">
                        <div class="flex items-center justify-between mb-2">
                            <span class="font-medium">${quest.desc}</span>
                            ${quest.claimed ? '<i data-lucide="check" class="w-5 h-5" style="color: #4CAF50;"></i>' : ''}
                        </div>
                        <div class="progress-bar mb-2">
                            <div class="progress-fill" style="width: ${progressPercent}%"></div>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-sm" style="color: var(--text-secondary);">${progress}/${quest.target}</span>
                            <div class="flex items-center gap-3">
                                <span class="text-sm flex items-center gap-1">
                                    <i data-lucide="coins" class="w-3 h-3" style="color: var(--liyue);"></i>
                                    ${quest.reward.mora}
                                </span>
                                <span class="text-sm flex items-center gap-1">
                                    <i data-lucide="gem" class="w-3 h-3" style="color: #6B8CE8;"></i>
                                    ${quest.reward.primogem}
                                </span>
                                ${quest.completed && !quest.claimed ? 
                                    `<button onclick="claimQuestReward('${quest.id}')" class="btn-gold text-sm px-3 py-1">领取</button>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        function renderConstellations() {
            const container = document.getElementById('constellationList');
            container.innerHTML = constellations.map(c => {
                const isUnlocked = gameState.unlockedConstellations.includes(c.id);
                return `
                    <div class="constellation-card ${isUnlocked ? 'unlocked' : 'locked'}">
                        <div class="flex items-center gap-3 mb-2">
                            <div class="w-10 h-10 rounded-full flex items-center justify-center" 
                                 style="background: ${isUnlocked ? 'var(--inazuma)' : 'rgba(100,100,100,0.3)'};">
                                <i data-lucide="zap" class="w-5 h-5 ${isUnlocked ? 'text-white' : 'text-gray-500'}"></i>
                            </div>
                            <div>
                                <p class="font-bold" style="color: ${isUnlocked ? 'var(--inazuma)' : 'var(--text-secondary)'};">${c.name}</p>
                                <p class="text-xs" style="color: var(--text-secondary);">${c.desc}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-4 text-xs" style="color: var(--text-secondary);">
                            <span class="flex items-center gap-1">
                                <i data-lucide="coins" class="w-3 h-3" style="color: var(--liyue);"></i>
                                +${c.reward.mora}
                            </span>
                            <span class="flex items-center gap-1">
                                <i data-lucide="gem" class="w-3 h-3" style="color: #6B8CE8;"></i>
                                +${c.reward.primogem}
                            </span>
                            ${isUnlocked ? '<span style="color: #4CAF50;">已解锁</span>' : '<span>未解锁</span>'}
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
            document.getElementById('calendarView').classList.add('hidden');
            document.getElementById('dailyView').classList.add('hidden');
            document.getElementById('constellationView').classList.add('hidden');
            
            if (tab === 'calendar') {
                document.getElementById('calendarView').classList.remove('hidden');
                renderCalendar();
            } else if (tab === 'daily') {
                document.getElementById('dailyView').classList.remove('hidden');
                renderDailyQuests();
            } else if (tab === 'constellation') {
                document.getElementById('constellationView').classList.remove('hidden');
                renderConstellations();
            }
        }

        function startQuiz(day) {
            playClick();
            currentQuiz.day = day;
            currentQuiz.currentQuestion = 0;
            currentQuiz.answers = [];
            currentQuiz.combo = 0;
            const rawQ = questionBank[day] || questionBank[1];
            currentQuiz.questions = rawQ.map(q => shuffleOptions(q));
            currentQuiz.correctCount = 0;
            
            document.getElementById('comboDisplay').classList.add('hidden');
            const topic = dayTopics.find(t => t.day === day);
            document.getElementById('quizTitle').textContent = `Day ${day} - ${topic.title}`;
            document.getElementById('quizModal').classList.remove('hidden');
            const modal = document.querySelector('#quizModal .modal-content');
            modal.classList.add('question-enter');
            setTimeout(() => modal.classList.remove('question-enter'), 300);
            renderQuestion();
        }

        function renderQuestion() {
            const q = currentQuiz.questions[currentQuiz.currentQuestion];
            const qNum = currentQuiz.currentQuestion + 1;
            const totalQ = currentQuiz.questions.length;
            
            document.getElementById('currentQuestionNum').textContent = qNum;
            document.getElementById('quizProgress').style.width = `${(qNum / totalQ) * 100}%`;
            document.getElementById('questionText').textContent = q.q;
            
            const diffClass = q.difficulty === 'basic' ? 'difficulty-basic' : 
                              q.difficulty === 'advanced' ? 'difficulty-advanced' : 'difficulty-challenge';
            const diffText = q.difficulty === 'basic' ? '基础' : q.difficulty === 'advanced' ? '进阶' : '挑战';
            const diffBadge = document.getElementById('difficultyBadge');
            diffBadge.className = `difficulty-badge ${diffClass}`;
            diffBadge.textContent = diffText;
            
            const comboDisp = document.getElementById('comboDisplay');
            if (currentQuiz.combo >= 2) {
                comboDisp.classList.remove('hidden');
                comboDisp.classList.toggle('hot', currentQuiz.combo >= 5);
                document.getElementById('comboCount').textContent = currentQuiz.combo;
            } else {
                comboDisp.classList.add('hidden');
            }
            
            const optionsContainer = document.getElementById('optionsContainer');
            const labels = ['A', 'B', 'C', 'D'];
            const answered = currentQuiz.answers[currentQuiz.currentQuestion] !== undefined;
            
            optionsContainer.innerHTML = q.options.map((opt, i) => {
                let className = 'option-btn';
                if (answered) {
                    className += ' disabled';
                    if (i === q.answer) className += ' correct';
                    else if (i === currentQuiz.answers[currentQuiz.currentQuestion]) className += ' wrong';
                }
                return `
                    <button class="${className}" onclick="selectOption(${i})" ${answered ? 'disabled' : ''}>
                        <span class="font-bold mr-2" style="color: var(--primary-gold);">${labels[i]}.</span>
                        ${opt}
                        ${answered && i === q.answer ? '<i data-lucide="check" class="w-4 h-4 inline ml-2" style="color: #4CAF50;"></i>' : ''}
                        ${answered && i === currentQuiz.answers[currentQuiz.currentQuestion] && i !== q.answer ? '<i data-lucide="x" class="w-4 h-4 inline ml-2" style="color: #f44336;"></i>' : ''}
                    </button>
                `;
            }).join('');
            
            const qContainer = document.getElementById('questionContainer');
            qContainer.classList.remove('question-enter');
            void qContainer.offsetWidth;
            qContainer.classList.add('question-enter');
            
            document.getElementById('explanationBox').classList.add('hidden');
            document.getElementById('prevQuestion').disabled = currentQuiz.currentQuestion === 0;
            document.getElementById('prevQuestion').classList.toggle('opacity-50', currentQuiz.currentQuestion === 0);
            
            const nextBtn = document.getElementById('nextQuestion');
            if (currentQuiz.currentQuestion === totalQ - 1 && answered) {
                nextBtn.innerHTML = '查看结果<i data-lucide="trophy" class="w-4 h-4 inline ml-1"></i>';
                nextBtn.disabled = false;
                nextBtn.classList.remove('opacity-50');
            } else {
                nextBtn.innerHTML = '下一题<i data-lucide="chevron-right" class="w-4 h-4 inline ml-1"></i>';
                nextBtn.disabled = !answered;
                nextBtn.classList.toggle('opacity-50', !answered);
            }
            
            lucide.createIcons();
        }

        function selectOption(index) {
            if (currentQuiz.answers[currentQuiz.currentQuestion] !== undefined) return;
            
            const q = currentQuiz.questions[currentQuiz.currentQuestion];
            currentQuiz.answers[currentQuiz.currentQuestion] = index;
            gameState.totalAnswered++;
            
            const isCorrect = index === q.answer;
            const btn = event.currentTarget;
            const rect = btn.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            
            if (isCorrect) {
                currentQuiz.correctCount++;
                currentQuiz.combo++;
                gameState.totalCorrect++;
                if (currentQuiz.combo > (gameState.bestCombo || 0)) {
                    gameState.bestCombo = currentQuiz.combo;
                }
                playCorrect();
                spawnParticles(cx, cy, '#4CAF50', 10);
                if (currentQuiz.combo >= 3) {
                    playCombo(currentQuiz.combo);
                    showComboPopup(currentQuiz.combo);
                    if (currentQuiz.combo >= 5) {
                        spawnParticles(cx, cy, '#FFD700', 8);
                    }
                }
                updateDailyQuestProgress('correctAnswer', 1);
            } else {
                currentQuiz.combo = 0;
                playWrong();
                document.querySelector('.modal-content').classList.add('shake');
                setTimeout(() => document.querySelector('.modal-content').classList.remove('shake'), 500);
            }
            
            document.getElementById('explanationText').textContent = q.explanation;
            document.getElementById('explanationBox').classList.remove('hidden');
            
            setTimeout(() => renderQuestion(), 100);
        }

        function prevQuestion() {
            playClick();
            if (currentQuiz.currentQuestion > 0) {
                currentQuiz.currentQuestion--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            playClick();
            const totalQ = currentQuiz.questions.length;
            if (currentQuiz.currentQuestion === totalQ - 1) {
                if (currentQuiz.answers[currentQuiz.currentQuestion] !== undefined) {
                    finishQuiz();
                }
            } else {
                currentQuiz.currentQuestion++;
                renderQuestion();
            }
        }

        function finishQuiz() {
            playStar();
            const totalQ = currentQuiz.questions.length;
            const correct = currentQuiz.correctCount;
            const accuracy = correct / totalQ;
            
            let stars = 1;
            if (accuracy >= 0.8) stars = 3;
            else if (accuracy >= 0.6) stars = 2;
            
            const comboBonus = Math.min(currentQuiz.combo * 5, 50);
            const expEarned = 20 + stars * 10 + comboBonus;
            const moraEarned = 200 + stars * 100 + comboBonus * 2;
            const primogemEarned = 5 + stars * 5 + (accuracy === 1 ? 10 : 0);
            
            if (!gameState.completedDays.includes(currentQuiz.day)) {
                gameState.completedDays.push(currentQuiz.day);
                updateDailyQuestProgress('completeDay', 1);
            }
            
            const existingStar = gameState.starRecords.find(s => s.day === currentQuiz.day);
            if (existingStar) {
                if (stars > existingStar.stars) {
                    existingStar.stars = stars;
                }
            } else {
                gameState.starRecords.push({ day: currentQuiz.day, stars: stars });
            }
            
            if (stars === 3) {
                updateDailyQuestProgress('threeStar', 1);
            }
            
            updateDailyQuestProgress('totalCorrect', correct);
            
            gameState.currentExp += expEarned;
            gameState.mora += moraEarned;
            gameState.primogem += primogemEarned;
            
            const prevConstellations = [...gameState.unlockedConstellations];
            checkConstellations();
            const newConstellation = constellations.find(c => 
                !prevConstellations.includes(c.id) && gameState.unlockedConstellations.includes(c.id)
            );
            
            saveGameState();
            
            document.getElementById('quizModal').classList.add('hidden');
            document.getElementById('resultModal').classList.remove('hidden');
            
            const topic = dayTopics.find(t => t.day === currentQuiz.day);
            document.getElementById('resultDay').textContent = `Day ${currentQuiz.day} - ${topic.title}`;
            document.getElementById('correctCount').textContent = correct;
            document.getElementById('accuracy').textContent = Math.round(accuracy * 100) + '%';
            document.getElementById('earnedExp').textContent = expEarned;
            document.getElementById('earnedMora').textContent = '+' + moraEarned;
            document.getElementById('earnedPrimogem').textContent = '+' + primogemEarned;
            
            const starContainer = document.getElementById('starRating');
            starContainer.innerHTML = [1,2,3].map((i, idx) => 
                `<i data-lucide="star" class="w-10 h-10 ${i <= stars ? 'star fill-current star-pop' : 'star empty'}" style="animation-delay: ${idx * 0.2}s; opacity: 0;"></i>`
            ).join('');
            if (stars >= 1) {
                setTimeout(() => spawnParticles(window.innerWidth/2, window.innerHeight/2 - 100, '#FFD700', 20), 300);
            }
            
            const newAchDiv = document.getElementById('newAchievement');
            if (newConstellation) {
                newAchDiv.classList.remove('hidden');
                document.getElementById('achievementText').textContent = `解锁命之座：${newConstellation.name}`;
            } else {
                newAchDiv.classList.add('hidden');
            }
            
            lucide.createIcons();
            updateUI();
        }

        function closeQuiz() {
            if (confirm('确定要退出挑战吗？当前进度将不会保存。')) {
                document.getElementById('quizModal').classList.add('hidden');
                currentQuiz = { day: null, currentQuestion: 0, answers: [], questions: [], correctCount: 0, combo: 0, shuffledQuestions: [] };
            }
        }

        function closeResult() {
            playClick();
            document.getElementById('resultModal').classList.add('hidden');
            currentQuiz = { day: null, currentQuestion: 0, answers: [], questions: [], correctCount: 0, combo: 0, shuffledQuestions: [] };
            renderCalendar();
        }

        function updateDailyQuestProgress(type, amount) {
            gameState.dailyQuests.forEach(quest => {
                if (quest.type === type && !quest.completed) {
                    quest.progress += amount;
                    if (quest.progress >= quest.target) {
                        quest.progress = quest.target;
                        quest.completed = true;
                    }
                }
            });
            saveGameState();
        }

        function claimQuestReward(questId) {
            const quest = gameState.dailyQuests.find(q => q.id === questId);
            if (quest && quest.completed && !quest.claimed) {
                quest.claimed = true;
                gameState.mora += quest.reward.mora;
                gameState.primogem += quest.reward.primogem;
                saveGameState();
                updateUI();
                renderDailyQuests();
            }
        }

        function showAchievements() {
            document.getElementById('achievementModal').classList.remove('hidden');
            const list = document.getElementById('achievementList');
            list.innerHTML = constellations.map(c => {
                const isUnlocked = gameState.unlockedConstellations.includes(c.id);
                return `
                    <div class="flex items-center gap-4 p-3 rounded-lg ${isUnlocked ? '' : 'opacity-50'}"
                         style="background: ${isUnlocked ? 'rgba(168, 90, 245, 0.1)' : 'rgba(50,50,50,0.2)'};">
                        <div class="w-12 h-12 rounded-full flex items-center justify-center"
                             style="background: ${isUnlocked ? 'var(--inazuma)' : '#444'};">
                            <i data-lucide="award" class="w-6 h-6 ${isUnlocked ? 'text-white' : 'text-gray-500'}"></i>
                        </div>
                        <div class="flex-1">
                            <p class="font-bold" style="color: ${isUnlocked ? 'var(--primary-gold-light)' : '#888'};">${c.name}</p>
                            <p class="text-sm" style="color: var(--text-secondary);">${c.desc}</p>
                        </div>
                        <div class="text-right">
                            ${isUnlocked ? 
                                '<span style="color: #4CAF50; font-size: 12px;">已达成</span>' : 
                                '<span style="color: #888; font-size: 12px;">未达成</span>'}
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        function closeAchievements() {
            document.getElementById('achievementModal').classList.add('hidden');
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedSound = localStorage.getItem('genshinMathSound');
            if (savedSound !== null) soundEnabled = savedSound === 'true';
            
            loadGameState();
            renderCalendar();
            lucide.createIcons();
            
            requestAnimationFrame(() => {
                setTimeout(() => {
                    const overlay = document.getElementById('loadingOverlay');
                    if (overlay) overlay.classList.add('hidden');
                }, 300);
            });
            
            document.addEventListener('click', () => initAudio(), { once: true });
        });
    </script>
</body>
</html>
