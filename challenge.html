    <style id="theme-vars">

.dark {

  --genshin-primary-foreground: #1A1408;
  --genshin-primary-50: #2A1E0C;
  --genshin-primary-100: #423014;
  --genshin-primary-200: #5E471A;
  --genshin-primary-300: #7C5F20;
  --genshin-primary-400: #9A7826;
  --genshin-primary-500: #B8932E;
  --genshin-primary-600: #C8A95B;
  --genshin-primary-700: #D9B85A;
  --genshin-primary-800: #E7D08A;
  --genshin-primary-900: #F3E8C2;
  --genshin-primary-950: #FBF6E7;
  --genshin-background: #0E1120;
  --genshin-foreground: #ECE7D8;
  --genshin-card: #181C2E;
  --genshin-card-foreground: #ECE7D8;
  --genshin-popover: #1F2438;
  --genshin-muted: #262B42;
  --genshin-muted-foreground: #9A968A;
  --genshin-border: rgba(200, 169, 91, 0.18);
  --genshin-state-success: #74C2A1;
  --genshin-state-warning: #E6B445;
  --genshin-state-error: #D97766;
  --genshin-state-info: #6FB7E0;
}
@theme inline {
  --color-background: var(--genshin-background);
  --color-foreground: var(--genshin-foreground);
  --color-card: var(--genshin-card);
  --color-primary: var(--genshin-primary);
  --color-muted: var(--genshin-muted);
  --color-muted-foreground: var(--genshin-muted-foreground);
  --color-border: var(--genshin-border);
  --color-state-success: var(--genshin-state-success);
  --color-state-warning: var(--genshin-state-warning);
  --color-state-error: var(--genshin-state-error);
  --radius-sm: var(--genshin-radius-small);
  --radius-md: var(--genshin-radius-medium);
  --radius-lg: var(--genshin-radius-large);
}
.font-display { font-family: "Noto Serif SC", "Songti SC", "STSong", serif; font-weight: 600; letter-spacing: 0.02em; }
.font-body { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--genshin-background);
    --color-foreground: var(--genshin-foreground);
    --color-card: var(--genshin-card);
    --color-primary: var(--genshin-primary);
    --color-muted: var(--genshin-muted);
    --color-muted-foreground: var(--genshin-muted-foreground);
    --color-border: var(--genshin-border);
    --radius-sm: var(--genshin-radius-small);
    --radius-md: var(--genshin-radius-medium);
    --radius-lg: var(--genshin-radius-large);
  }
  @layer base { body { background: var(--genshin-background); color: var(--genshin-foreground); } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
body {
  line-height: 1.75;
  background-color: var(--genshin-background);
  background-image:
    radial-gradient(1.5px 1.5px at 5% 12%, rgba(255,255,255,0.65), transparent 60%),
    radial-gradient(1px 1px at 18% 25%, rgba(255,255,255,0.40), transparent 60%),
    radial-gradient(1.5px 1.5px at 52% 15%, rgba(255,255,255,0.60), transparent 60%),
    radial-gradient(2px 2px at 82% 18%, rgba(255,255,255,0.55), transparent 60%),
    radial-gradient(1.5px 1.5px at 95% 35%, rgba(255,255,255,0.50), transparent 60%),
    linear-gradient(180deg, var(--genshin-background) 0%, #14182B 100%);
  background-attachment: fixed;
  background-repeat: no-repeat;
  min-height: 100vh;
}
.genshin-card {
  background-color: var(--genshin-card);
  border: 1px solid rgba(200,169,91,0.18);
  border-radius: 12px;
  transition: border-color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
}
.genshin-card:hover { border-color: rgba(200,169,91,0.40); }
.section-title {
  font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
  font-weight: 600;
  letter-spacing: 0.02em;
  position: relative;
  padding-left: 0.75rem;
}
.section-title::before {
  content: ""; position: absolute; left: 0; top: 50%;
  width: 3px; height: 1.1em; background: var(--genshin-primary);
  border-radius: 2px; transform: translateY(-50%);
}
.genshin-divider {
  position: relative; height: 1px;
  background: linear-gradient(90deg, transparent 0%, rgba(200,169,91,0.45) 50%, transparent 100%);
}
.genshin-divider::after {
  content: ""; position: absolute; top: 50%; left: 50%;
  width: 8px; height: 8px; background: var(--genshin-primary);
  transform: translate(-50%, -50%) rotate(45deg);
}
.nav-link { text-decoration: none; position: relative; color: var(--genshin-muted-foreground); transition: color 0.2s ease; }
.nav-link:hover { color: var(--genshin-primary); }
.nav-link[data-active="true"] { color: var(--genshin-primary); font-weight: 600; }
.brand-link { text-decoration: none; }
/* 秘境节点动画 */
@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(200,169,91,0.4); }
  50% { box-shadow: 0 0 20px 6px rgba(200,169,91,0.2); }
}
.available-node { animation: pulse-glow 2s infinite; }
@keyframes node-spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
.node-ring { animation: node-spin 20s linear infinite; }
/* 奖励弹出动画 */
@keyframes reward-pop {
  0% { transform: scale(0.5); opacity: 0; }
  60% { transform: scale(1.1); }
  100% { transform: scale(1); opacity: 1; }
}
.reward-item { animation: reward-pop 0.5s cubic-bezier(.22,1,.36,1) forwards; }
/* 进度条填充 */
.progress-fill { transition: width 0.6s cubic-bezier(.22,1,.36,1); }
/* 选项按钮 */
.option-btn {
  transition: all 0.2s ease;
  border: 1px solid var(--genshin-border);
}
.option-btn:hover { border-color: var(--genshin-primary); background: rgba(200,169,91,0.08); }
.option-btn.correct { border-color: var(--genshin-state-success); background: rgba(116,194,161,0.15); }
.option-btn.wrong { border-color: var(--genshin-state-error); background: rgba(217,119,102,0.15); }
.option-btn.disabled { pointer-events: none; }
/* 命之座节点 */
.constellation-node { transition: all 0.3s ease; }
.constellation-node.unlocked { filter: drop-shadow(0 0 8px var(--genshin-primary)); }
/* 浮动数字 */
@keyframes float-up {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(-40px); opacity: 0; }
}
.floating-text { animation: float-up 1s ease-out forwards; pointer-events: none; }
/* 星星评级 */
@keyframes star-pop {
  0% { transform: scale(0) rotate(-180deg); opacity: 0; }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}
.star-get { animation: star-pop 0.4s cubic-bezier(.22,1,.36,1) forwards; }
/* 秘境卡片 */
.domain-card {
  position: relative; overflow: hidden;
}
.domain-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 120px; opacity: 0.25;
}
.domain-card[data-element="anemo"]::before { background: radial-gradient(ellipse at top, var(--element-anemo), transparent 70%); }
.domain-card[data-element="geo"]::before { background: radial-gradient(ellipse at top, var(--element-geo), transparent 70%); }
.domain-card[data-element="electro"]::before { background: radial-gradient(ellipse at top, var(--element-electro), transparent 70%); }
.domain-card[data-element="hydro"]::before { background: radial-gradient(ellipse at top, var(--element-hydro), transparent 70%); }
.domain-card[data-element="dendro"]::before { background: radial-gradient(ellipse at top, var(--element-dendro), transparent 70%); }
/* 滚动条美化 */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(200,169,91,0.25); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(200,169,91,0.4); }
/* 页面切换 */
.view-page { display: none; }
.view-page.active { display: block; }
/* 移动端 */
@media (max-width: 767px) {
  .domain-grid { grid-template-columns: 1fr !important; }
}
    </style>
</head>
<body class="min-h-screen font-body antialiased">
    <!-- 顶部导航栏 -->
    <nav class="fixed top-0 inset-x-0 z-50" style="background: rgba(14,17,32,0.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(200,169,91,0.28);">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
        <a href="index.html" class="brand-link flex items-center gap-2.5 cursor-pointer shrink-0">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 2 L20.5 6.75 L20.5 16.25 L12 21 L3.5 16.25 L3.5 6.75 Z" stroke="#C8A95B" stroke-width="1.4" fill="rgba(200,169,91,0.10)"/><circle cx="12" cy="11.5" r="2.2" fill="#C8A95B"/></svg>
          <span class="font-display text-lg whitespace-nowrap" style="color: var(--genshin-primary);">提瓦特数学图鉴</span>
        </a>
        <!-- 状态栏 -->
        <div class="flex items-center gap-2 sm:gap-4 text-sm">
          <div class="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-lg" style="background: rgba(200,169,91,0.1);">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C8A95B" stroke-width="2"><path d="M12 2L15 8.5L22 9.5L17 14.5L18.5 22L12 18L5.5 22L7 14.5L2 9.5L9 8.5L12 2Z"/></svg>
            <span class="font-display" id="top-ar">1</span>
          </div>
          <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg" style="background: rgba(200,169,91,0.1);">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="#C8A95B"><circle cx="12" cy="12" r="10"/></svg>
            <span id="top-mora">0</span>
          </div>
          <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg" style="background: rgba(116,194,161,0.1);">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="#74C2A1"><polygon points="12,2 22,8.5 22,15.5 12,22 2,15.5 2,8.5"/></svg>
            <span id="top-primogem">0</span>
          </div>
        </div>
      </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 pt-24 pb-12">
      <!-- ============ 页面1：秘境地图（主界面） ============ -->
      <div id="view-map" class="view-page active">
        <!-- 顶部欢迎区 -->
        <section class="mb-8 reveal">
          <div class="genshin-card p-6 sm:p-8 relative overflow-hidden">
            <div class="absolute inset-0 pointer-events-none" style="background: radial-gradient(ellipse 50% 100% at 10% 0%, rgba(200,169,91,0.12) 0%, transparent 60%);"></div>
            <div class="relative flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
              <div>
                <div class="flex items-center gap-3 mb-2">
                  <span class="text-xs px-2.5 py-1 rounded-full font-display" style="background: rgba(200,169,91,0.15); color: var(--genshin-primary);">秘境试炼</span>
                  <span class="text-xs" style="color: var(--genshin-muted-foreground);">每日委托已刷新</span>
                </div>
                <h1 class="font-display text-3xl sm:text-4xl mb-2" style="color: var(--genshin-primary);">旅行者，准备好挑战了吗？</h1>
                <p class="text-sm max-w-xl" style="color: var(--genshin-muted-foreground);">进入五国秘境，通过答题试炼点亮命之座，提升冒险等阶，获得丰厚奖励！</p>
              </div>
              <div class="flex gap-4 flex-wrap">
                <button onclick="showView('view-daily')" class="px-5 py-2.5 rounded-lg text-sm font-medium cursor-pointer transition hover:brightness-110 flex items-center gap-2" style="background: var(--genshin-state-success); color: white;">
                  <i data-lucide="calendar-check" class="w-4 h-4"></i>每日委托
                </button>
                <button onclick="showView('view-constellation')" class="px-5 py-2.5 rounded-lg text-sm font-medium cursor-pointer transition hover:brightness-110 flex items-center gap-2" style="border: 1px solid var(--genshin-primary); color: var(--genshin-primary);">
                  <i data-lucide="star" class="w-4 h-4"></i>命之座
                </button>
              </div>
            </div>
          </div>
        </section>

        <!-- 冒险等阶进度 -->
        <section class="mb-8">
          <div class="genshin-card p-5">
            <div class="flex items-center justify-between mb-3">
              <div class="flex items-center gap-3">
                <span class="w-10 h-10 rounded-full flex items-center justify-center font-display text-lg" style="background: linear-gradient(135deg, #C8A95B, #9A7826); color: white;" id="ar-badge">1</span>
                <div>
                  <div class="font-display text-base">冒险等阶 <span id="ar-level-text">1</span></div>
                  <div class="text-xs" style="color: var(--genshin-muted-foreground);">阅历 <span id="ar-exp">0</span> / <span id="ar-exp-max">100</span></div>
                </div>
              </div>
              <div class="text-right text-xs" style="color: var(--genshin-muted-foreground);">
                <div>总星数 <span class="font-display text-base" style="color: var(--genshin-primary);" id="total-stars">0</span> / <span id="total-stars-max">45</span></div>
                <div>已通关 <span class="font-display" style="color: var(--genshin-primary);" id="cleared-count">0</span> 个秘境</div>
              </div>
            </div>
            <div class="h-2 rounded-full overflow-hidden" style="background: var(--genshin-muted);">
              <div class="h-full rounded-full progress-fill" id="ar-progress-bar" style="width: 0%; background: linear-gradient(90deg, #C8A95B, #E7D08A);"></div>
            </div>
          </div>
        </section>

        <!-- 五大秘境选择 -->
        <section>
          <h2 class="section-title font-display text-xl sm:text-2xl mb-6">选择秘境</h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 domain-grid" id="domains-container">
            <!-- 由 JS 动态生成 -->
          </div>
        </section>
      </div>

      <!-- ============ 页面2：秘境关卡选择 ============ -->
      <div id="view-levels" class="view-page">
        <div class="mb-6 flex items-center gap-3">
          <button onclick="showView('view-map')" class="w-10 h-10 rounded-lg flex items-center justify-center transition hover:bg-white/5" style="border: 1px solid var(--genshin-border);">
            <i data-lucide="arrow-left" class="w-5 h-5"></i>
          </button>
          <div>
            <h1 class="font-display text-2xl sm:text-3xl" id="domain-title">秘境名称</h1>
            <p class="text-sm" style="color: var(--genshin-muted-foreground);" id="domain-subtitle">国度 · 元素</p>
          </div>
        </div>

        <!-- 关卡路径图 -->
        <div class="genshin-card p-6 sm:p-8">
          <div class="relative" id="levels-container">
            <!-- 由 JS 动态生成 -->
          </div>
        </div>
      </div>

      <!-- ============ 页面3：答题界面 ============ -->
      <div id="view-quiz" class="view-page">
        <div class="mb-6 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <button onclick="exitQuiz()" class="w-10 h-10 rounded-lg flex items-center justify-center transition hover:bg-white/5" style="border: 1px solid var(--genshin-border);">
              <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <div>
              <h1 class="font-display text-xl sm:text-2xl" id="quiz-level-name">关卡名称</h1>
              <p class="text-xs" style="color: var(--genshin-muted-foreground);">题目 <span id="quiz-current">1</span> / <span id="quiz-total">5</span></p>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <div id="quiz-stars" class="flex gap-1"></div>
          </div>
        </div>

        <!-- 题目进度条 -->
        <div class="mb-6 h-1.5 rounded-full overflow-hidden" style="background: var(--genshin-muted);">
          <div class="h-full rounded-full progress-fill" id="quiz-progress-bar" style="width: 0%; background: var(--genshin-primary);"></div>
        </div>

        <!-- 题目卡片 -->
        <div class="genshin-card p-6 sm:p-8 mb-6" id="question-card">
          <div class="mb-2 flex items-center gap-2">
            <span class="text-xs px-2 py-0.5 rounded" id="question-type" style="background: rgba(200,169,91,0.1); color: var(--genshin-primary);">选择题</span>
            <span class="text-xs" style="color: var(--genshin-muted-foreground);" id="difficulty-badge">难度：普通</span>
          </div>
          <h3 class="font-display text-lg sm:text-xl mb-6 leading-relaxed" id="question-text"></h3>
          <div class="space-y-3" id="options-container"></div>
        </div>

        <!-- 反馈区域 -->
        <div id="feedback-area" class="hidden mb-6">
          <div class="genshin-card p-5" id="feedback-card">
            <div class="flex items-start gap-3 mb-3">
              <span id="feedback-icon" class="w-8 h-8 rounded-full flex items-center justify-center shrink-0"></span>
              <div>
                <div class="font-display text-base mb-1" id="feedback-title"></div>
                <div class="text-sm" style="color: var(--genshin-muted-foreground);" id="feedback-explanation"></div>
              </div>
            </div>
            <button onclick="nextQuestion()" class="w-full py-3 rounded-lg text-sm font-medium cursor-pointer transition hover:brightness-110 mt-4" style="background: var(--genshin-primary); color: var(--genshin-primary-foreground);">
              继续前进
            </button>
          </div>
        </div>
      </div>

      <!-- ============ 页面4：结算界面 ============ -->
      <div id="view-result" class="view-page">
        <div class="max-w-lg mx-auto text-center pt-8">
          <div class="genshin-card p-8 sm:p-10">
            <div class="mb-6">
              <div class="w-20 h-20 rounded-full mx-auto flex items-center justify-center mb-4" style="background: rgba(200,169,91,0.12);" id="result-icon-circle">
                <i data-lucide="trophy" class="w-10 h-10" style="color: var(--genshin-primary);"></i>
              </div>
              <h2 class="font-display text-3xl mb-2" style="color: var(--genshin-primary);" id="result-title">试炼完成！</h2>
              <p class="text-sm" style="color: var(--genshin-muted-foreground);" id="result-subtitle"></p>
            </div>

            <!-- 星级评价 -->
            <div class="flex justify-center gap-3 mb-8" id="result-stars"></div>

            <!-- 奖励列表 -->
            <div class="mb-8">
              <h3 class="text-sm mb-4" style="color: var(--genshin-muted-foreground);">获得奖励</h3>
              <div class="flex justify-center gap-6 flex-wrap" id="result-rewards"></div>
            </div>

            <!-- 统计数据 -->
            <div class="grid grid-cols-3 gap-3 mb-8 p-4 rounded-lg" style="background: var(--genshin-muted);">
              <div>
                <div class="font-display text-2xl" style="color: var(--genshin-state-success);" id="result-correct">0</div>
                <div class="text-xs mt-1" style="color: var(--genshin-muted-foreground);">正确</div>
              </div>
              <div>
                <div class="font-display text-2xl" style="color: var(--genshin-state-error);" id="result-wrong">0</div>
                <div class="text-xs mt-1" style="color: var(--genshin-muted-foreground);">错误</div>
              </div>
              <div>
                <div class="font-display text-2xl" style="color: var(--genshin-primary);" id="result-accuracy">0%</div>
                <div class="text-xs mt-1" style="color: var(--genshin-muted-foreground);">正确率</div>
              </div>

    ];

    // ============ 游戏状态管理 ============
    let gameState = {
      arLevel: 1,
      arExp: 0,
      mora: 0,
      primogem: 0,
      totalStars: 0,
      clearedLevels: {},
      constellations: {},
      dailyCommissions: { date: '', done: [], claimed: false },
      perfectClears: 0
    };

    const AR_EXP_TABLE = [0, 100, 200, 350, 500, 700, 950, 1250, 1600, 2000, 2500, 3100, 3800, 4600, 5500];

    function getExpForLevel(level) {
      return AR_EXP_TABLE[Math.min(level - 1, AR_EXP_TABLE.length - 1)] || 9999;
    }

    function saveGame() {
      localStorage.setItem('genshin_math_save', JSON.stringify(gameState));
    }

    function loadGame() {
      const saved = localStorage.getItem('genshin_math_save');
      if (saved) {
        try { gameState = Object.assign(gameState, JSON.parse(saved)); } catch(e) {}
      }
      checkDailyReset();
    }

    function checkDailyReset() {
      const today = new Date().toDateString();
      if (gameState.dailyCommissions.date !== today) {
        gameState.dailyCommissions = { date: today, done: [], claimed: false };
        saveGame();
      }
    }

    function addExp(amount) {
      const bonus = gameState.constellations.c1 ? 1.1 : 1;
      gameState.arExp += Math.floor(amount * bonus);
      while (gameState.arLevel < 15 && gameState.arExp >= getExpForLevel(gameState.arLevel)) {
        gameState.arExp -= getExpForLevel(gameState.arLevel);
        gameState.arLevel++;
        showFloatingText('冒险等阶提升!', '#C8A95B');
      }
      saveGame();
      updateUI();
    }

    function addMora(amount) {
      const bonus = (gameState.constellations.c2 ? 1.2 : 1) * (gameState.constellations.c6 ? 1.25 : 1);
      gameState.mora += Math.floor(amount * bonus);
      saveGame();
      updateUI();
    }

    function addPrimogem(amount) {
      gameState.primogem += amount;
      saveGame();
      updateUI();
    }

    // ============ 页面切换 ============
    let currentDomain = null;
    let currentLevel = null;
    let quizState = null;

    function showView(viewId) {
      document.querySelectorAll('.view-page').forEach(p => p.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
      window.scrollTo(0, 0);
      if (viewId === 'view-map') { renderDomains(); }
      if (viewId === 'view-constellation') { renderConstellations(); }
      if (viewId === 'view-daily') { renderDaily(); }
      lucide.createIcons();
    }

    // ============ 渲染秘境地图 ============
    function renderDomains() {
      const container = document.getElementById('domains-container');
      container.innerHTML = DOMAINS.map((domain, idx) => {
        const domainLevels = Object.keys(gameState.clearedLevels).filter(k => k.startsWith(domain.id + '-')).length;
        const domainStars = Object.keys(gameState.clearedLevels).filter(k => k.startsWith(domain.id + '-'))
          .reduce((sum, k) => sum + (gameState.clearedLevels[k].stars || 0), 0);
        const isCleared = domainLevels >= domain.levels;
        const isLocked = idx > 0 && !isDomainUnlocked(DOMAINS[idx - 1]);
        const unlockText = isLocked ? `需先通关${DOMAINS[idx-1].nation}` : '';
        return `
          <div class="genshin-card domain-card p-6 cursor-pointer ${isLocked ? 'opacity-50 pointer-events-none' : 'available-node'}" 
               data-element="${domain.element}" onclick="${isLocked ? '' : `enterDomain('${domain.id}')`}">
            <div style="height:4px; background-color:${domain.color};"></div>
            <div class="relative pt-4">
              <div class="flex items-center gap-4 mb-4">
                <div class="relative w-14 h-14 shrink-0">
                  <div class="node-ring absolute inset-0 rounded-full border-2 border-dashed" style="border-color:${domain.color}40;"></div>
                  <span class="absolute inset-2 rounded-full flex items-center justify-center font-display text-xl" style="background:${domain.color}20;border:2px solid ${domain.color};color:${domain.color};">${domain.elementName}</span>
                </div>
                <div class="min-w-0">
                  <h3 class="font-display text-lg truncate">${domain.name}</h3>
                  <p class="text-xs" style="color:${domain.color};">${domain.nation} · ${domain.elementName}元素</p>
                </div>
              </div>
              <p class="text-sm mb-4 leading-relaxed" style="color:var(--genshin-muted-foreground);">${domain.desc}</p>
              <div class="flex items-center justify-between text-sm">
                <div class="flex items-center gap-3">
                  <span style="color:var(--genshin-muted-foreground);">进度 ${domainLevels}/${domain.levels}</span>
                  <div class="flex gap-0.5">
                    ${[1,2,3].map(s => `<span style="color:${domainStars >= s*3 || (s===1&&domainStars>=3) || (s===2&&domainStars>=9) || (s===3&&domainStars===15) ? domain.color : 'rgba(255,255,255,0.15)'};">★</span>`).join('')}
                  </div>
                </div>
                ${isLocked ? `<span class="text-xs" style="color:var(--genshin-state-error);">🔒 ${unlockText}</span>` : 
                  isCleared ? `<span class="text-xs" style="color:var(--genshin-state-success);">✓ 已通关</span>` :
                  `<span style="color:var(--genshin-primary);">进入 →</span>`}
              </div>
            </div>
          </div>`;
      }).join('');
      updateUI();
    }

    function isDomainUnlocked(domain) {
      return Object.keys(gameState.clearedLevels).filter(k => k.startsWith(domain.id + '-')).length >= domain.levels;
    }

    function enterDomain(domainId) {
      currentDomain = DOMAINS.find(d => d.id === domainId);
      document.getElementById('domain-title').textContent = currentDomain.name;
      document.getElementById('domain-title').style.color = currentDomain.color;
      document.getElementById('domain-subtitle').textContent = `${currentDomain.nation} · ${currentDomain.elementName}元素秘境`;
      renderLevels();
      showView('view-levels');
    }

    // ============ 渲染关卡选择 ============
    function renderLevels() {
      const container = document.getElementById('levels-container');
      let html = '<div class="flex flex-wrap justify-center gap-4 sm:gap-8">';
      for (let i = 1; i <= currentDomain.levels; i++) {
        const levelKey = currentDomain.id + '-' + i;
        const cleared = gameState.clearedLevels[levelKey];
        const stars = cleared ? cleared.stars : 0;
        const isUnlocked = i === 1 || gameState.clearedLevels[currentDomain.id + '-' + (i - 1)];
        html += `
          <div class="flex flex-col items-center ${!isUnlocked ? 'opacity-40' : 'cursor-pointer'}" 
               onclick="${isUnlocked ? `startLevel(${i})` : ''}">
            <div class="relative w-16 h-16 sm:w-20 sm:h-20 rounded-full flex items-center justify-center mb-2 transition-all
                        ${isUnlocked && !cleared ? 'available-node' : ''}"
                 style="background:${cleared ? `linear-gradient(135deg, ${currentDomain.color}, ${currentDomain.color}80)` : `${currentDomain.color}15`};
                        border: 2px solid ${isUnlocked ? currentDomain.color : 'rgba(255,255,255,0.1)'};
                        color: ${cleared ? 'white' : (isUnlocked ? currentDomain.color : 'var(--genshin-muted-foreground)')};">
              ${cleared ? `<i data-lucide="check" class="w-8 h-8"></i>` : 
                isUnlocked ? `<span class="font-display text-2xl">${i}</span>` : 
                `<i data-lucide="lock" class="w-6 h-6"></i>`}
            </div>
            <span class="text-xs mb-1" style="color:var(--genshin-muted-foreground);">第${i}关</span>
            <div class="flex gap-0.5 text-sm">
              ${[1,2,3].map(s => `<span style="color:${stars >= s ? '#E6B445' : 'rgba(255,255,255,0.12)'};">★</span>`).join('')}
            </div>
          </div>`;
        if (i < currentDomain.levels) {
          html += `<div class="hidden sm:flex items-center" style="color:${gameState.clearedLevels[levelKey] ? currentDomain.color : 'rgba(255,255,255,0.1)'};">
            <div class="w-8 h-px" style="background:currentColor;"></div>
            <i data-lucide="chevron-right" class="w-4 h-4"></i>
            <div class="w-8 h-px" style="background:currentColor;"></div>
          </div>`;
        }
      }
      html += '</div>';
      html += `<div class="mt-8 text-center text-sm" style="color:var(--genshin-muted-foreground);">
        <p>每关5题 · 全对3星 · 错1题2星 · 错2题1星 · 错≥3题需要重试</p>
      </div>`;
      container.innerHTML = html;
      lucide.createIcons();
    }

    // ============ 答题逻辑 ============
    function startLevel(levelNum) {
      currentLevel = levelNum;
      const questions = QUESTION_BANK[currentDomain.id][levelNum - 1] || QUESTION_BANK[currentDomain.id][0];
      quizState = {
        questions: [...questions].sort(() => Math.random() - 0.5).slice(0, 5),
        current: 0,
        correct: 0,
        wrong: 0,
        stars: 0,
        answered: false
      };
      document.getElementById('quiz-level-name').textContent = `${currentDomain.name} · 第${levelNum}关`;
      document.getElementById('quiz-total').textContent = quizState.questions.length;
      showView('view-quiz');
      renderQuestion();
    }

    function renderQuestion() {
      const q = quizState.questions[quizState.current];
      document.getElementById('quiz-current').textContent = quizState.current + 1;
      document.getElementById('quiz-progress-bar').style.width = `${(quizState.current / quizState.questions.length) * 100}%`;
      document.getElementById('question-type').textContent = q.type;
      document.getElementById('difficulty-badge').textContent = `难度：${q.difficulty}`;
      document.getElementById('question-text').textContent = q.q;
      
      const starsContainer = document.getElementById('quiz-stars');
      const possibleStars = Math.max(0, 3 - quizState.wrong);
      starsContainer.innerHTML = [1,2,3].map(s => `<span class="text-lg" style="color:${s <= possibleStars ? '#E6B445' : 'rgba(255,255,255,0.12)'};">★</span>`).join('');

      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = q.options.map((opt, idx) => `
        <button class="option-btn w-full text-left p-4 rounded-lg text-sm font-body flex items-center gap-3" data-idx="${idx}" onclick="selectOption(${idx})">
          <span class="w-7 h-7 shrink-0 rounded-full flex items-center justify-center text-xs font-display" style="border:1px solid currentColor;">${String.fromCharCode(65+idx)}</span>
          <span class="flex-1">${opt}</span>
        </button>
      `).join('');
      
      document.getElementById('feedback-area').classList.add('hidden');
      quizState.answered = false;
    }

    function selectOption(idx) {
      if (quizState.answered) return;
      quizState.answered = true;
      const q = quizState.questions[quizState.current];
      const isCorrect = idx === q.answer;
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.classList.add('disabled'));
      
      buttons[q.answer].classList.add('correct');
      if (!isCorrect) {
        buttons[idx].classList.add('wrong');
        quizState.wrong++;
      } else {
        quizState.correct++;
        showFloatingText('+10 阅历', '#74C2A1');
      }

      const feedbackArea = document.getElementById('feedback-area');
      const feedbackCard = document.getElementById('feedback-card');
      const feedbackIcon = document.getElementById('feedback-icon');
      const feedbackTitle = document.getElementById('feedback-title');
      const feedbackExplain = document.getElementById('feedback-explanation');
      
      feedbackArea.classList.remove('hidden');
      if (isCorrect) {
        feedbackCard.style.borderColor = 'var(--genshin-state-success)';
        feedbackIcon.style.background = 'rgba(116,194,161,0.15)';
        feedbackIcon.innerHTML = '<i data-lucide="check" class="w-5 h-5" style="color:var(--genshin-state-success);"></i>';
        feedbackTitle.textContent = '回答正确！';
        feedbackTitle.style.color = 'var(--genshin-state-success)';
      } else {
        feedbackCard.style.borderColor = 'var(--genshin-state-error)';
        feedbackIcon.style.background = 'rgba(217,119,102,0.15)';
        feedbackIcon.innerHTML = '<i data-lucide="x" class="w-5 h-5" style="color:var(--genshin-state-error);"></i>';
        feedbackTitle.textContent = '回答错误';
        feedbackTitle.style.color = 'var(--genshin-state-error)';
      }
      feedbackExplain.textContent = q.explain;
      lucide.createIcons();
    }

    function nextQuestion() {
      quizState.current++;
      if (quizState.current >= quizState.questions.length) {
        finishQuiz();
      } else {
        renderQuestion();
      }
    }

    function exitQuiz() {
      if (confirm('确定要退出试炼吗？当前进度将不会保存。')) {
        showView('view-levels');
      }
    }

    function finishQuiz() {
      const accuracy = quizState.correct / quizState.questions.length;
      let stars = 0;
      if (quizState.wrong === 0) stars = 3;
      else if (quizState.wrong === 1) stars = 2;
      else if (quizState.wrong === 2) stars = 1;
      quizState.stars = stars;

      const levelKey = currentDomain.id + '-' + currentLevel;
      const oldStars = gameState.clearedLevels[levelKey]?.stars || 0;
      const isNewClear = !gameState.clearedLevels[levelKey];
      const isNewRecord = stars > oldStars;

      const expReward = 50 + stars * 20;
      const moraReward = 100 + stars * 50;
      let primogemReward = stars;

      if (isNewClear) {
        gameState.clearedLevels[levelKey] = { stars: stars, clearedAt: Date.now() };
        primogemReward += 5;
        if (stars === 3) { gameState.perfectClears++; }
      } else if (isNewRecord) {
        gameState.clearedLevels[levelKey].stars = stars;
        primogemReward = Math.max(0, primogemReward - oldStars);
      } else {
        primogemReward = 0;
      }

      // 每日委托检查
      checkDailyCommission(currentDomain.id, stars >= 2);

      gameState.totalStars = Object.values(gameState.clearedLevels).reduce((s, v) => s + v.stars, 0);
      addExp(expReward);
      addMora(moraReward);
      if (primogemReward > 0) addPrimogem(primogemReward);
      checkConstellations();

      document.getElementById('result-title').textContent = stars >= 1 ? '试炼完成！' : '试炼失败';
      document.getElementById('result-subtitle').textContent = stars >= 1 ? `获得${stars}星评价` : '很遗憾，没有获得星星，再试一次吧！';
      document.getElementById('result-correct').textContent = quizState.correct;
      document.getElementById('result-wrong').textContent = quizState.wrong;
      document.getElementById('result-accuracy').textContent = Math.round(accuracy * 100) + '%';

      const resultStars = document.getElementById('result-stars');
      resultStars.innerHTML = [1,2,3].map((s, i) => `
        <span class="star-get text-4xl sm:text-5xl" style="color:${s <= stars ? '#E6B445' : 'rgba(255,255,255,0.12)'}; animation-delay:${i*0.2}s;">★</span>
      `).join('');

      const resultRewards = document.getElementById('result-rewards');
      let rewardHtml = `
        <div class="reward-item flex flex-col items-center gap-1">
          <div class="w-12 h-12 rounded-full flex items-center justify-center" style="background:rgba(200,169,91,0.12);">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C8A95B" stroke-width="2"><path d="M12 2L15 8.5L22 9.5L17 14.5L18.5 22L12 18L5.5 22L7 14.5L2 9.5L9 8.5L12 2Z"/></svg>
          </div>
          <span class="text-sm font-display" style="color:var(--genshin-primary);">+${expReward}</span>
          <span class="text-xs" style="color:var(--genshin-muted-foreground);">阅历</span>
        </div>
        <div class="reward-item flex flex-col items-center gap-1" style="animation-delay:0.15s;">
          <div class="w-12 h-12 rounded-full flex items-center justify-center" style="background:rgba(200,169,91,0.12);">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="#C8A95B"><circle cx="12" cy="12" r="10"/></svg>
          </div>
          <span class="text-sm font-display" style="color:var(--genshin-primary);">+${moraReward}</span>
          <span class="text-xs" style="color:var(--genshin-muted-foreground);">摩拉</span>
        </div>`;
      if (primogemReward > 0) {
        rewardHtml += `
          <div class="reward-item flex flex-col items-center gap-1" style="animation-delay:0.3s;">
            <div class="w-12 h-12 rounded-full flex items-center justify-center" style="background:rgba(116,194,161,0.12);">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="#74C2A1"><polygon points="12,2 22,8.5 22,15.5 12,22 2,15.5 2,8.5"/></svg>
            </div>
            <span class="text-sm font-display" style="color:var(--genshin-state-success);">+${primogemReward}</span>
            <span class="text-xs" style="color:var(--genshin-muted-foreground);">原石</span>
          </div>`;
      }
      resultRewards.innerHTML = rewardHtml;
      showView('view-result');
      lucide.createIcons();
    }

    function retryLevel() { startLevel(currentLevel); }

    // ============ 每日委托 ============
    function getDailyCommissions() {
      const shuffled = [...DOMAINS].sort(() => Math.random() - 0.5);
      return shuffled.slice(0, 4).map((d, i) => ({ id: d.id, domainId: d.id, name: d.name, desc: `在${d.name}完成1关并获得2星以上`, reward: { mora: 200, exp: 80, primogem: 1 } }));
    }

    let dailyCache = null;

    function checkDailyCommission(domainId, passed) {
      if (!dailyCache) dailyCache = getDailyCommissions();
      const today = gameState.dailyCommissions;
      dailyCache.forEach((c, i) => {
        if (c.domainId === domainId && passed && !today.done.includes(i)) {
          today.done.push(i);
          addMora(c.reward.mora);
          addExp(c.reward.exp);
          if (today.done.length === 4 && !today.claimed) {
            today.claimed = true;
            addPrimogem(5);
            showFloatingText('每日委托完成！+5原石', '#74C2A1');
          }
          saveGame();
        }
      });
    }

    function renderDaily() {
      if (!dailyCache || gameState.dailyCommissions.date !== new Date().toDateString()) {
        dailyCache = getDailyCommissions();
      }
      const container = document.getElementById('daily-commissions');
      const done = gameState.dailyCommissions.done.length;
      document.getElementById('daily-done').textContent = done;
      document.getElementById('daily-progress-bar').style.width = `${(done/4)*100}%`;

      container.innerHTML = dailyCache.map((c, i) => {
        const isDone = gameState.dailyCommissions.done.includes(i);
        const domain = DOMAINS.find(d => d.id === c.domainId);
        return `
          <div class="genshin-card p-5 flex items-center gap-4 ${isDone ? 'opacity-70' : ''}">
            <div class="w-12 h-12 rounded-full flex items-center justify-center shrink-0" style="background:${domain.color}20;border:2px solid ${isDone ? 'var(--genshin-state-success)' : domain.color};">
              ${isDone ? `<i data-lucide="check" class="w-6 h-6" style="color:var(--genshin-state-success);"></i>` : 
                `<span class="font-display text-lg" style="color:${domain.color};">${domain.elementName}</span>`}
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2">
                <h3 class="font-display text-base">${c.name}</h3>
                ${isDone ? '<span class="text-xs px-2 py-0.5 rounded-full" style="background:rgba(116,194,161,0.15);color:var(--genshin-state-success);">已完成</span>' : ''}
              </div>
              <p class="text-sm" style="color:var(--genshin-muted-foreground);">${c.desc}</p>
              <div class="flex gap-3 mt-2 text-xs" style="color:var(--genshin-muted-foreground);">
                <span>奖励：${c.reward.mora}摩拉 · ${c.reward.exp}阅历 · ${c.reward.primogem}原石</span>
              </div>
            </div>
            ${!isDone ? `<button onclick="enterDomain('${c.domainId}')" class="px-4 py-2 rounded-lg text-sm cursor-pointer shrink-0" style="background:var(--genshin-primary);color:var(--genshin-primary-foreground);">前往</button>` : ''}
          </div>`;
      }).join('');
      lucide.createIcons();
    }

    // ============ 命之座 ============
    function checkConstellations() {
      CONSTELLATIONS.forEach(c => {
        if (gameState.constellations[c.id]) return;
        const req = c.req;
        let unlocked = true;
        if (req.clearedLevels && Object.keys(gameState.clearedLevels).length < req.clearedLevels) unlocked = false;
        if (req.perfectClear && gameState.perfectClears < 1) unlocked = false;
        if (req.clearedDomains) {
          const clearedDomains = new Set(Object.keys(gameState.clearedLevels).map(k => k.split('-')[0])).size;
          if (clearedDomains < req.clearedDomains) unlocked = false;
        }
        if (req.arLevel && gameState.arLevel < req.arLevel) unlocked = false;
        if (req.totalStars && gameState.totalStars < req.totalStars) unlocked = false;
        if (unlocked) {
          gameState.constellations[c.id] = true;
          showFloatingText(`命之座·${c.name} 点亮!`, '#C8A95B');
        }
      });
      saveGame();
    }

    function renderConstellations() {
      const container = document.getElementById('constellation-container');
      checkConstellations();
      container.innerHTML = CONSTELLATIONS.map(c => {
        const unlocked = gameState.constellations[c.id];
        return `
          <div class="genshin-card p-6 constellation-node ${unlocked ? 'unlocked' : 'opacity-60'}">
            <div class="flex items-start gap-4">
              <div class="w-14 h-14 rounded-full flex items-center justify-center shrink-0" 
                   style="background:${unlocked ? 'rgba(200,169,91,0.15)' : 'var(--genshin-muted)'} ;border:2px solid ${unlocked ? '#C8A95B' : 'var(--genshin-border)'};">
                <i data-lucide="${c.icon}" class="w-7 h-7" style="color:${unlocked ? '#C8A95B' : 'var(--genshin-muted-foreground)'};"></i>
              </div>
              <div class="flex-1">
                <div class="flex items-center gap-2 mb-1">
                  <h3 class="font-display text-lg">${c.name}</h3>
                  ${unlocked ? '<span class="text-xs px-2 py-0.5 rounded-full" style="background:rgba(200,169,91,0.15);color:var(--genshin-primary);">已激活</span>' : ''}
                </div>
                <p class="text-sm mb-2" style="color:var(--genshin-muted-foreground);">${c.desc}</p>
                <p class="text-xs" style="color:${unlocked ? 'var(--genshin-state-success)' : 'var(--genshin-primary)'};">效果：${c.bonus}</p>
              </div>
            </div>
          </div>`;
      }).join('');
      lucide.createIcons();
    }

    // ============ UI 更新 ============
    function updateUI() {
      document.getElementById('top-ar').textContent = gameState.arLevel;
      document.getElementById('top-mora').textContent = gameState.mora;
      document.getElementById('top-primogem').textContent = gameState.primogem;
      document.getElementById('ar-badge').textContent = gameState.arLevel;
      document.getElementById('ar-level-text').textContent = gameState.arLevel;
      document.getElementById('ar-exp').textContent = gameState.arExp;
      document.getElementById('ar-exp-max').textContent = getExpForLevel(gameState.arLevel);
      const expMax = getExpForLevel(gameState.arLevel);
      document.getElementById('ar-progress-bar').style.width = `${Math.min(100, (gameState.arExp / expMax) * 100)}%`;
      document.getElementById('total-stars').textContent = gameState.totalStars;
      const clearedDomains = new Set(Object.keys(gameState.clearedLevels).map(k => k.split('-')[0])).size;
      document.getElementById('cleared-count').textContent = Object.keys(gameState.clearedLevels).length;
    }

    // ============ 浮动文字 ============
    function showFloatingText(text, color) {
      const container = document.getElementById('floating-container');
      const el = document.createElement('div');
      el.className = 'floating-text fixed top-1/2 left-1/2 font-display text-xl font-bold z-50';
      el.style.color = color;
      el.style.transform = 'translate(-50%, -50%)';
      el.style.textShadow = '0 2px 8px rgba(0,0,0,0.5)';
      el.textContent = text;
      container.appendChild(el);
      setTimeout(() => el.remove(), 1000);
    }

    // ============ 初始化 ============
    loadGame();
    renderDomains();
    lucide.createIcons();

    // Reveal animations
    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver(entries => {
        entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('reveal-visible'); io.unobserve(e.target); }});
      }, { rootMargin: '0px 0px -60px 0px', threshold: 0.08 });
      document.querySelectorAll('.reveal').forEach(el => io.observe(el));
    }
    </script>
</body>
</html>
