    <style>
        :root {
            --primary-gold: #C8A95B;
            --primary-gold-light: #E8D5A3;
            --primary-gold-dark: #8B7355;
            --bg-dark: #0D0B1A;
            --bg-darker: #07060F;
            --bg-card: rgba(20, 18, 40, 0.9);
            --mondstadt: #74C2A1;
            --liyue: #D4B863;
            --inazuma: #A85AF5;
            --fontaine: #4CC2F0;
            --sumeru: #7BC94A;
            --text-primary: #E8E0D0;
            --text-secondary: #9B9588;
            --border-gold: linear-gradient(135deg, #C8A95B, #8B7355, #C8A95B);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background: 
                radial-gradient(ellipse at top, rgba(100, 80, 180, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at bottom, rgba(40, 30, 80, 0.3) 0%, transparent 50%),
                var(--bg-dark);
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #fff, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                radial-gradient(2px 2px at 130px 80px, rgba(255,255,255,0.6), transparent),
                radial-gradient(1px 1px at 160px 120px, #fff, transparent),
                radial-gradient(2px 2px at 200px 50px, rgba(255,255,255,0.7), transparent),
                radial-gradient(1px 1px at 250px 160px, #fff, transparent),
                radial-gradient(2px 2px at 300px 90px, rgba(255,255,255,0.5), transparent);
            background-size: 350px 200px;
            animation: twinkle 5s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .gold-border {
            border: 2px solid;
            border-image: var(--border-gold) 1;
            background: var(--bg-card);
            box-shadow: 0 0 20px rgba(200, 169, 91, 0.1), inset 0 0 20px rgba(200, 169, 91, 0.05);
        }

        .gold-border-glow {
            position: relative;
        }

        .gold-border-glow::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(135deg, #C8A95B, #E8D5A3, #C8A95B);
            border-radius: inherit;
            z-index: -1;
            opacity: 0.6;
            filter: blur(8px);
        }

        .btn-gold {
            background: linear-gradient(135deg, #C8A95B, #8B7355);
            color: #fff;
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            box-shadow: 0 4px 15px rgba(200, 169, 91, 0.3);
        }

        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(200, 169, 91, 0.5);
        }

        .btn-gold:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .day-card {
            background: rgba(20, 18, 40, 0.9);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .day-card.unlocked:hover {
            transform: translateY(-4px);
        }

        .day-card.unlocked:focus-visible {
            outline: 3px solid var(--primary-gold);
            outline-offset: 3px;
        }

        .day-card.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .day-card.completed {
            border: 2px solid var(--primary-gold);
            background: rgba(200, 169, 91, 0.08);
        }

        .day-card.completed:hover {
            box-shadow: 0 0 20px rgba(200, 169, 91, 0.3);
        }

        .nation-mondstadt { border-left: 4px solid var(--mondstadt); }
        .nation-liyue { border-left: 4px solid var(--liyue); }
        .nation-inazuma { border-left: 4px solid var(--inazuma); }
        .nation-fontaine { border-left: 4px solid var(--fontaine); }
        .nation-sumeru { border-left: 4px solid var(--sumeru); }

        .char-avatar-fallback {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            position: absolute;
            right: 10px;
            top: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid rgba(255,255,255,0.25);
            background: linear-gradient(135deg, rgba(100,80,200,0.6), rgba(50,40,100,0.8));
            z-index: 2;
            animation: charBreath 3s ease-in-out infinite;
        }

        .quiz-char-portrait {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary-gold);
            flex-shrink: 0;
        }

        .quiz-char-info {
            flex: 1;
        }

        .quiz-char-quote {
            font-size: 12px;
            font-style: italic;
            opacity: 0.8;
            margin-top: 2px;
            color: var(--text-secondary);
        }

        .day-card .char-bg-glow {
            position: absolute;
            right: -20px;
            top: -20px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            filter: blur(25px);
            opacity: 0.15;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .day-card:hover .char-bg-glow {
            opacity: 0.3;
        }

        .char-portrait-bg {
            position: absolute;
            right: -10px;
            bottom: -10px;
            width: 90px;
            height: 110px;
            object-fit: cover;
            object-position: top;
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
            mask-image: linear-gradient(to top left, black 20%, transparent 80%);
            -webkit-mask-image: linear-gradient(to top left, black 20%, transparent 80%);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .day-card:hover .char-portrait-bg {
            opacity: 0.25;
            transform: scale(1.05);
        }

        /* ===== 七元素粒子特效容器 ===== */
        .element-particles {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            border-radius: 12px;
            z-index: 0;
        }

        .el-particle {
            position: absolute;
            pointer-events: none;
        }

        /* 风元素：旋转的风痕 */
        .el-anemo .el-particle {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(116,194,168,0.7) 0%, transparent 70%);
            animation: anemoDrift 5s linear infinite;
        }
        @keyframes anemoDrift {
            0% { opacity: 0; transform: translate(0, 20px) rotate(0deg) scale(0); }
            15% { opacity: 0.6; transform: translate(5px, 5px) rotate(90deg) scale(1); }
            50% { opacity: 0.4; transform: translate(-10px, -20px) rotate(180deg) scale(0.8); }
            100% { opacity: 0; transform: translate(15px, -70px) rotate(360deg) scale(0.2); }
        }

        /* 岩元素：六边形晶体 */
        .el-geo .el-particle {
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-bottom: 7px solid rgba(240,182,50,0.6);
            filter: drop-shadow(0 0 4px rgba(240,182,50,0.5));
            animation: geoFloat 6s ease-in-out infinite;
        }
        @keyframes geoFloat {
            0% { opacity: 0; transform: translateY(15px) rotate(0deg) scale(0); }
            20% { opacity: 0.7; transform: translateY(-5px) rotate(120deg) scale(1); }
            80% { opacity: 0.5; transform: translateY(-40px) rotate(240deg) scale(0.9); }
            100% { opacity: 0; transform: translateY(-70px) rotate(360deg) scale(0.3); }
        }

        /* 雷元素：电弧闪烁 */
        .el-electro .el-particle {
            width: 3px;
            height: 10px;
            background: linear-gradient(to top, rgba(176,136,232,0.8), transparent);
            border-radius: 2px;
            box-shadow: 0 0 6px rgba(176,136,232,0.8), 0 0 12px rgba(176,136,232,0.4);
            animation: electroSpark 2.5s ease-in-out infinite;
        }
        @keyframes electroSpark {
            0%, 100% { opacity: 0; transform: translateY(10px) scaleY(0.5); }
            10% { opacity: 1; transform: translateY(0) scaleY(1.2); }
            20% { opacity: 0.3; transform: translateY(-10px) scaleY(0.8); }
            30% { opacity: 0.9; transform: translateY(-20px) scaleY(1.1); }
            50% { opacity: 0; transform: translateY(-50px) scaleY(0.3); }
        }

        /* 草元素：飘落的叶子 */
        .el-dendro .el-particle {
            width: 8px;
            height: 6px;
            background: radial-gradient(ellipse, rgba(123,201,74,0.7) 0%, transparent 70%);
            border-radius: 50% 0 50% 50%;
            animation: dendroLeaf 7s ease-in-out infinite;
        }
        @keyframes dendroLeaf {
            0% { opacity: 0; transform: translate(0, 10px) rotate(-30deg) scale(0); }
            20% { opacity: 0.6; transform: translate(8px, -5px) rotate(15deg) scale(1); }
            50% { opacity: 0.5; transform: translate(-5px, -30px) rotate(-20deg) scale(0.9); }
            80% { opacity: 0.3; transform: translate(10px, -55px) rotate(25deg) scale(0.7); }
            100% { opacity: 0; transform: translate(-8px, -75px) rotate(-10deg) scale(0.2); }
        }

        /* 水元素：气泡上升 */
        .el-hydro .el-particle {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(76,194,240,0.5) 50%, transparent);
            border: 1px solid rgba(76,194,240,0.4);
            animation: hydroBubble 4s ease-in infinite;
        }
        @keyframes hydroBubble {
            0% { opacity: 0; transform: translateY(15px) scale(0.3); }
            20% { opacity: 0.7; transform: translateY(0) scale(1); }
            60% { opacity: 0.5; transform: translateY(-30px) translateX(5px) scale(0.9); }
            100% { opacity: 0; transform: translateY(-70px) translateX(-3px) scale(0.4); }
        }

        /* 火元素：跳动的火焰 */
        .el-pyro .el-particle {
            width: 5px;
            height: 8px;
            background: radial-gradient(ellipse at bottom, rgba(255,120,40,0.9), rgba(255,200,50,0.4) 60%, transparent);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            filter: blur(0.5px);
            animation: pyroFlame 2s ease-in-out infinite;
        }
        @keyframes pyroFlame {
            0% { opacity: 0; transform: translateY(10px) scale(0.5) skewX(0deg); }
            25% { opacity: 0.9; transform: translateY(-5px) scale(1.1) skewX(-5deg); }
            50% { opacity: 0.7; transform: translateY(-25px) scale(0.9) skewX(5deg); }
            75% { opacity: 0.4; transform: translateY(-45px) scale(0.7) skewX(-3deg); }
            100% { opacity: 0; transform: translateY(-65px) scale(0.2) skewX(0deg); }
        }

        /* 冰元素：雪花冰晶 */
        .el-cryo .el-particle {
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, rgba(212,238,249,0.9) 0%, rgba(160,215,239,0.3) 60%, transparent);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            animation: cryoSnow 6s linear infinite;
        }
        @keyframes cryoSnow {
            0% { opacity: 0; transform: translateY(15px) rotate(0deg) scale(0); }
            20% { opacity: 0.8; transform: translateY(0) rotate(72deg) scale(1); }
            50% { opacity: 0.6; transform: translateY(-30px) translateX(8px) rotate(180deg) scale(0.8); }
            80% { opacity: 0.3; transform: translateY(-55px) translateX(-5px) rotate(288deg) scale(0.5); }
            100% { opacity: 0; transform: translateY(-75px) rotate(360deg) scale(0.1); }
        }

        /* ===== 角色头像呼吸浮动+边框流光 ===== */
        .char-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            position: absolute;
            right: 10px;
            top: 36px;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.25);
            background: rgba(30,25,60,0.8);
            z-index: 2;
            animation: charBreath 3s ease-in-out infinite;
            box-shadow: 0 0 8px rgba(255,255,255,0.1);
        }

        .day-card:hover .char-avatar {
            animation: charBreath 2s ease-in-out infinite, charGlowPulse 1.5s ease-in-out infinite;
            border-color: var(--primary-gold);
        }

        @keyframes charBreath {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-3px) scale(1.03); }
        }

        @keyframes charGlowPulse {
            0%, 100% { box-shadow: 0 0 8px rgba(200,169,91,0.3), 0 0 16px rgba(200,169,91,0.1); }
            50% { box-shadow: 0 0 14px rgba(200,169,91,0.6), 0 0 28px rgba(200,169,91,0.2); }
        }

        /* 元素标识徽章 */
        .element-badge {
            position: absolute;
            right: 8px;
            top: 8px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            z-index: 4;
            border: 1.5px solid rgba(255,255,255,0.4);
            box-shadow: 0 0 6px currentColor;
        }

        /* ===== 答题角色反应动画 ===== */
        @keyframes charEnter {
            0% { opacity: 0; transform: translateX(-20px) scale(0.8) rotate(-10deg); }
            60% { opacity: 1; transform: translateX(3px) scale(1.05) rotate(2deg); }
            100% { opacity: 1; transform: translateX(0) scale(1) rotate(0deg); }
        }

        @keyframes charHappy {
            0%, 100% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.15) rotate(-5deg); }
            50% { transform: scale(1.1) rotate(5deg) translateY(-5px); }
            75% { transform: scale(1.12) rotate(-3deg); }
        }

        @keyframes charSad {
            0%, 100% { transform: scale(1) rotate(0deg); filter: brightness(1); }
            20% { transform: scale(0.92) rotate(-8deg); filter: brightness(0.7) saturate(0.5); }
            40% { transform: scale(0.95) rotate(6deg); filter: brightness(0.8) saturate(0.6); }
            60% { transform: scale(0.93) rotate(-4deg); filter: brightness(0.75) saturate(0.5); }
            80% { transform: scale(0.96) rotate(2deg); filter: brightness(0.85) saturate(0.7); }
        }

        .quiz-char-portrait.char-enter { animation: charEnter 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .quiz-char-portrait.char-happy { animation: charHappy 0.6s ease-in-out; }
        .quiz-char-portrait.char-sad { animation: charSad 0.5s ease-in-out; }

        /* 答题界面元素粒子爆发 */
        .quiz-element-burst {
            position: absolute;
            pointer-events: none;
            z-index: 10;
        }

        /* ===== 卡片hover时元素能量聚集 ===== */
        .day-card.unlocked:hover {
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        .day-card.unlocked:hover .element-particles .el-particle {
            animation-duration: 2s !important;
            opacity: 1 !important;
        }

        .char-name-tag {
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 4px;
            background: rgba(200,169,91,0.2);
            color: var(--primary-gold);
            display: inline-block;
            margin-left: 6px;
            font-weight: normal;
        }

        .knowledge-tip {
            font-size: 11px;
            padding: 6px 8px;
            margin-top: 6px;
            border-radius: 6px;
            background: rgba(200,169,91,0.08);
            border-left: 2px solid var(--primary-gold);
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .option-btn {
            background: rgba(40, 35, 70, 0.8);
            border: 2px solid rgba(200, 169, 91, 0.3);
            padding: 16px 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            width: 100%;
            color: var(--text-primary);
            font-size: 15px;
        }

        .option-btn:hover:not(.disabled) {
            border-color: var(--primary-gold);
            background: rgba(60, 50, 100, 0.8);
        }

        .option-btn.correct {
            border-color: #4CAF50;
            background: rgba(76, 175, 80, 0.2);
        }

        .option-btn.wrong {
            border-color: #f44336;
            background: rgba(244, 67, 54, 0.2);
        }

        .option-btn.disabled {
            cursor: not-allowed;
        }

        .star {
            color: var(--primary-gold);
            text-shadow: 0 0 10px rgba(200, 169, 91, 0.5);
        }

        .star.empty {
            color: #3a3a4a;
            text-shadow: none;
        }

        .progress-bar {
            height: 8px;
            background: rgba(200, 169, 91, 0.2);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-gold-dark), var(--primary-gold-light));
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-content {
            background: var(--bg-card);
            border-radius: 16px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .resource-icon {
            width: 24px;
            height: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .primogem {
            background: linear-gradient(135deg, #6B8CE8, #4A6FD4);
        }

        .mora {
            background: linear-gradient(135deg, #D4B863, #B8963E);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .animate-fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        .animate-pulse-gold {
            animation: pulse 2s ease-in-out infinite;
        }

        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        .nation-header {
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-weight: bold;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .difficulty-badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .difficulty-basic {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
        }

        .difficulty-advanced {
            background: rgba(255, 152, 0, 0.2);
            color: #FF9800;
        }

        .difficulty-challenge {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
        }

        .constellation-card {
            background: rgba(168, 90, 245, 0.1);
            border: 1px solid rgba(168, 90, 245, 0.3);
            border-radius: 10px;
            padding: 12px;
            transition: all 0.3s ease;
        }

        .constellation-card.unlocked {
            background: rgba(168, 90, 245, 0.2);
            border-color: var(--inazuma);
            box-shadow: 0 0 15px rgba(168, 90, 245, 0.3);
        }

        .constellation-card.locked {
            opacity: 0.4;
        }

        .quest-card {
            background: rgba(20, 18, 40, 0.9);
            border-radius: 10px;

        /* ===== 新增趣味化动画 ===== */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        @keyframes correctPulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(76,175,80,0.7); }
            50% { transform: scale(1.02); box-shadow: 0 0 0 15px rgba(76,175,80,0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(76,175,80,0); }
        }

        @keyframes wrongShake {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(244,67,54,0); }
            25% { transform: scale(0.985); box-shadow: 0 0 0 4px rgba(244,67,54,0.2); }
            50% { transform: scale(1); box-shadow: 0 0 0 8px rgba(244,67,54,0.1); }
            75% { transform: scale(0.99); box-shadow: 0 0 0 4px rgba(244,67,54,0.15); }
        }

        @keyframes comboFloat {
            0% { opacity: 0; transform: translateY(0) scale(0.5); }
            20% { opacity: 1; transform: translateY(-20px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-80px) scale(0.8); }
        }

        @keyframes particleBurst {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes starPop {
            0% { transform: scale(0) rotate(-180deg); opacity: 0; }
            50% { transform: scale(1.3) rotate(10deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 5px rgba(200,169,91,0.3); }
            50% { box-shadow: 0 0 20px rgba(200,169,91,0.6), 0 0 40px rgba(200,169,91,0.2); }
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes fadeScale {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translate(-50%, -20px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        .shake { animation: shake 0.5s ease; }
        .correct-pulse { animation: correctPulse 0.6s ease; }
        .wrong-shake { animation: wrongShake 0.5s ease; }
        .combo-popup {
            position: fixed;
            top: 30%;
            left: 50%;
            transform: translateX(-50%);

            font-weight: bold;

            z-index: 200;
            pointer-events: none;
            animation: comboFloat 1.2s ease forwards;
        }
        .combo-popup.perfect { color: #FFD700; text-shadow: 0 0 30px rgba(255,215,0,1), 0 0 60px rgba(255,215,0,0.5); }
        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;

            animation: particleBurst 0.8s ease forwards;
        }
        .day-card.animate-in { animation: slideUp 0.5s ease forwards; opacity: 0; }
        .day-card.unlocked:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 8px 25px rgba(200,169,91,0.3);
        }
        .day-card.completed {

        .option-btn {
            position: relative;

        }
        .option-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
            transition: left 0.5s ease;
        }
        .option-btn:hover:not(.disabled)::before { left: 100%; }
        .option-btn:active:not(.disabled) { transform: scale(0.98); }
        .option-btn.correct {
            animation: correctPulse 0.6s ease;
        }
        .option-btn.wrong {
            animation: wrongShake 0.5s ease;
        }
        .star-pop { animation: starPop 0.5s ease forwards; }
        .question-enter { animation: fadeScale 0.3s ease; }
        .combo-display {
            display: flex;

        .sound-toggle {

        }

        .loading-overlay {

        .loading-overlay.hidden { opacity: 0; pointer-events: none; }
        .loading-spinner {

        @keyframes spin { to { transform: rotate(360deg); } }
        .progress-fill { will-change: width; }

        let audioCtx = null;
        let soundEnabled = true;
        let storageWarningShown = false;

        function reportStorageUnavailable(error) {
            if (storageWarningShown) return;
            storageWarningShown = true;
            console.warn('本地存储不可用，进度仅在当前页面保留。', error);
            setTimeout(() => showSaveNotification('当前浏览器禁止本地存储，进度仅在本次页面保留', 'warn'), 0);
        }

        function safeStorageGet(key) {
            try {
                return window.localStorage.getItem(key);
            } catch (error) {
                reportStorageUnavailable(error);
                return null;
            }
        }

        function safeStorageSet(key, value) {
            try {
                window.localStorage.setItem(key, value);
                return true;
            } catch (error) {
                reportStorageUnavailable(error);
                return false;
            }
        }

        function safeStorageRemove(key) {
            try {
                window.localStorage.removeItem(key);
                return true;
            } catch (error) {
                reportStorageUnavailable(error);
                return false;
            }
        }

        function initAudio() {
            if (!audioCtx) {
                try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
            }
        }

        function playTone(freq, duration, type = 'sine', volume = 0.15) {
            if (!soundEnabled || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function spawnParticles(x, y, color, count = 12) {
            if (window.matchMedia?.('(prefers-reduced-motion: reduce)').matches) return;
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const angle = (Math.PI * 2 / count) * i + Math.random() * 0.5;
                const dist = 40 + Math.random() * 60;
                p.style.cssText = `
                    left: ${x}px; top: ${y}px;
                    background: ${color};
                    --tx: ${Math.cos(angle) * dist}px;
                    --ty: ${Math.sin(angle) * dist}px;
                    box-shadow: 0 0 6px ${color};
                `;
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 800);
            }
        }

        /* ===== 选项洗牌（Fisher-Yates） ===== */
        function shuffleOptions(q) {
            const correctText = q.options[q.answer];
            const shuffled = [...q.options];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            const newAnswer = shuffled.indexOf(correctText);
            return { ...q, options: shuffled, answer: newAnswer };
        }

            answers: [],
            questions: [],
            correctCount: 0,
            combo: 0,
            shuffledQuestions: [],
            mode: 'normal',
            wrongQuestionIndices: []
        };

        function toSafeInt(value, fallback = 0, min = 0, max = Number.MAX_SAFE_INTEGER) {
            const number = Number(value);
            if (!Number.isFinite(number)) return fallback;
            return Math.min(max, Math.max(min, Math.trunc(number)));
        }

        function safeText(value, maxLength = 500) {
            return typeof value === 'string' ? value.slice(0, maxLength) : '';
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, char => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[char]);
        }

        function sanitizeKpPage(value) {
            const page = safeText(value, 120);
            return /^(?:index|functions|geometry|probability|calculus|elective)\.html(?:#[A-Za-z0-9_-]+)?$/.test(page)
                ? page
                : 'index.html';
        }

        function sanitizeWrongQuestion(value) {
            if (!value || typeof value !== 'object' || Array.isArray(value)) return null;
            const q = safeText(value.q, 500);
            const options = Array.isArray(value.options)
                ? value.options.slice(0, 4).map(option => safeText(option, 300))
                : [];
            const answer = toSafeInt(value.answer, -1, -1);
            if (!q || options.length < 2 || options.some(option => !option) || answer < 0 || answer >= options.length) return null;

            const rawDay = toSafeInt(value.day, 0);

            const normalized = {
                day: rawDay >= 1 && rawDay <= 30 ? rawDay : 0,
                q,
                options,
                answer,
                difficulty: ['basic', 'advanced', 'challenge'].includes(value.difficulty) ? value.difficulty : 'basic',
                explanation: safeText(value.explanation, 2000),
                knowledgePoint: safeText(value.knowledgePoint, 100) || '数学',
                kpPage: sanitizeKpPage(value.kpPage),
                wrongCount: toSafeInt(value.wrongCount, 1, 1, 999),
                lastWrong: toSafeInt(value.lastWrong, Date.now(), 0, Date.now() + 86400000)
            };
            normalized._key = getQuestionKey(normalized);
            return normalized;
        }

        function sanitizeSeenQuestionKeys(value) {
            const result = {};
            if (!value || typeof value !== 'object' || Array.isArray(value)) return result;
            for (let day = 1; day <= 30; day++) {
                const key = `day${day}`;
                if (!Array.isArray(value[key])) continue;
                result[key] = [...new Set(value[key]
                    .map(item => safeText(item, 2000))
                    .filter(Boolean))].slice(-20);
            }
            return result;
        }

        function normalizeGameState(value) {
            const source = value && typeof value === 'object' && !Array.isArray(value) ? value : {};
            const completedDays = [...new Set((Array.isArray(source.completedDays) ? source.completedDays : [])
                .map(day => toSafeInt(day, 0))
                .filter(day => day >= 1 && day <= 30))].sort((a, b) => a - b);

            const starByDay = new Map();
            (Array.isArray(source.starRecords) ? source.starRecords : []).forEach(record => {
                if (!record || typeof record !== 'object') return;
                const day = toSafeInt(record.day, 0);
                const stars = toSafeInt(record.stars, 0, 0, 3);
                if (day >= 1 && stars >= 1) starByDay.set(day, Math.max(starByDay.get(day) || 0, stars));
            });
            const starRecords = [...starByDay].map(([day, stars]) => ({ day, stars }));

            const wrongByKey = new Map();
            (Array.isArray(source.wrongQuestions) ? source.wrongQuestions : []).slice(-500).forEach(item => {
                const normalized = sanitizeWrongQuestion(item);
                if (!normalized) return;
                const previous = wrongByKey.get(normalized._key);
                if (previous) {
                    previous.wrongCount = Math.max(previous.wrongCount, normalized.wrongCount);
                    previous.lastWrong = Math.max(previous.lastWrong, normalized.lastWrong);
                } else {
                    wrongByKey.set(normalized._key, normalized);
                }
            });

            const masteredByKey = new Map();
            (Array.isArray(source.masteredQuestions) ? source.masteredQuestions : []).slice(-1000).forEach(item => {
                if (!item || typeof item !== 'object') return;
                const key = safeText(item._key, 2000);
                const q = safeText(item.q, 500);
                if (!key || !q) return;
                masteredByKey.set(key, {
                    _key: key,
                    q,
                    masteredAt: toSafeInt(item.masteredAt, Date.now(), 0, Date.now() + 86400000)
                });
            });

            const savedQuests = new Map((Array.isArray(source.dailyQuests) ? source.dailyQuests : [])
                .filter(quest => quest && typeof quest === 'object')
                .map(quest => [safeText(quest.id, 20), quest]));
            const dailyQuests = dailyQuestTemplates.map(template => {
                const saved = savedQuests.get(template.id) || {};
                const progress = toSafeInt(saved.progress, 0, 0, template.target);
                const completed = Boolean(saved.completed) || progress >= template.target;
                return { ...template, progress, completed, claimed: completed && Boolean(saved.claimed) };
            });

            const totalAnswered = toSafeInt(source.totalAnswered, 0, 0, 10000000);
            const totalCorrect = Math.min(totalAnswered, toSafeInt(source.totalCorrect, 0, 0, 10000000));
            const validConstellations = new Set(constellations.map(item => item.id));
            const unlockedConstellations = [...new Set((Array.isArray(source.unlockedConstellations)
                ? source.unlockedConstellations
                : []).filter(id => validConstellations.has(id)))];

            const saveTimestamp = toSafeInt(source.saveTimestamp, 0, 0, Date.now() + 86400000);
            return {
                ...DEFAULT_GAME_STATE,
                adventureRank: toSafeInt(source.adventureRank, 1, 1, 999),
                currentExp: toSafeInt(source.currentExp, 0, 0, 100000000),
                mora: toSafeInt(source.mora, DEFAULT_GAME_STATE.mora, 0, 1000000000),
                primogem: toSafeInt(source.primogem, DEFAULT_GAME_STATE.primogem, 0, 1000000000),
                completedDays,
                starRecords,
                totalAnswered,
                totalCorrect,
                unlockedConstellations,
                dailyQuests,
                lastDailyReset: safeText(source.lastDailyReset, 80) || null,
                bestCombo: toSafeInt(source.bestCombo, 0, 0, 1000000),
                soundEnabled: source.soundEnabled !== false,
                saveTimestamp: saveTimestamp || null,
                totalPlayTime: toSafeInt(source.totalPlayTime, 0, 0, 1000000000),
                wrongQuestions: [...wrongByKey.values()],
                masteredQuestions: [...masteredByKey.values()],
                seenQuestionKeys: sanitizeSeenQuestionKeys(source.seenQuestionKeys)
            };
        }

        function loadGameState() {
            try {
                const saved = safeStorageGet('genshinMathGame');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    gameState = normalizeGameState(parsed);
                    // 30-day expiry check (show warning but don't delete)
                    if (gameState.saveTimestamp) {
                        const daysSince = Math.floor((Date.now() - gameState.saveTimestamp) / 86400000);
                        if (daysSince >= 30) {
                            setTimeout(() => showSaveNotification('存档已超过30天，建议及时导出备份', 'warn'), 1500);
                        }
                    }
                    // Welcome back notification
                    if (gameState.completedDays.length > 0) {
                        setTimeout(() => {
                            showSaveNotification(`欢迎回来，旅行者！已完成 ${gameState.completedDays.length}/30 天挑战，最高${gameState.bestCombo}连击`, 'success');
                        }, 800);
                    }
                }
            } catch(e) {
                console.error('存档加载失败，将使用新存档:', e);
                gameState = { ...DEFAULT_GAME_STATE };
                safeStorageRemove('genshinMathGame');
            }
            checkDailyReset();
            updateUI();
        }

        function saveGameState() {
            try {
                gameState.saveTimestamp = Date.now();
                safeStorageSet('genshinMathGame', JSON.stringify(gameState));
            } catch(e) {
                console.error('存档保存失败:', e);
                showSaveNotification('存档保存失败！可能是浏览器存储已满', 'error');
            }
        }

        function showSaveNotification(msg, type = 'info') {

                success: '#4CAF50',

            const row = document.createElement('div');

        let dialogReturnFocus = null;

        function focusDialog(id, rememberFocus = true) {
            const dialog = document.getElementById(id);
            if (!dialog) return;
            if (rememberFocus && !dialogReturnFocus) dialogReturnFocus = document.activeElement;
            requestAnimationFrame(() => dialog.querySelector('.modal-content')?.focus());
        }

        function restoreDialogFocus() {
            const target = dialogReturnFocus;
            dialogReturnFocus = null;
            if (target && target.isConnected) target.focus();
        }

        function trapDialogFocus(event) {
            if (event.key !== 'Tab') return false;
            const visibleDialogs = [...document.querySelectorAll('[role="dialog"], [role="alertdialog"]')].filter(dialog =>
                !dialog.closest('.hidden') && dialog.getClientRects().length > 0
            );
            const dialog = visibleDialogs.at(-1);
            if (!dialog) return false;

            const focusable = [...dialog.querySelectorAll(
                'a[href], button:not([disabled]), input:not([disabled]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
            )].filter(element =>
                element.getClientRects().length > 0 &&
                element.getAttribute('aria-hidden') !== 'true'
            );

            if (focusable.length === 0) {
                event.preventDefault();
                (dialog.querySelector('.modal-content') || dialog).focus();
                return true;
            }

            const first = focusable[0];
            const last = focusable[focusable.length - 1];
            const active = document.activeElement;
            if (event.shiftKey && (active === first || !dialog.contains(active))) {
                event.preventDefault();
                last.focus();
            } else if (!event.shiftKey && (active === last || !dialog.contains(active))) {
                event.preventDefault();
                first.focus();
            }
            return true;
        }

        function exportSave() {
            const data = JSON.stringify(gameState, null, 2);
            const blob = new Blob([data], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `yuanshen-math-save-${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(a.href);
            closeSaveMenu();

        }

        function importSave(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (file.size > 1024 * 1024) {
                showSaveNotification('导入失败：存档文件不能超过 1 MB', 'error');
                event.target.value = '';
                return;
            }
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!data.completedDays || !Array.isArray(data.completedDays)) throw new Error('无效存档');
                    const overwrite = await themedConfirm({
                        title: '导入存档',
                        message: '导入将覆盖当前进度，确定继续？',
                        confirmText: '覆盖导入'
                    });
                    if (!overwrite) return;
                    gameState = normalizeGameState(data);
                    checkDailyReset();
                    saveGameState();
                    closeSaveMenu();
                    renderCalendar();
                    updateUI();
                    updateWrongBookBadge();
                    showSaveNotification('存档导入成功！', 'success');
                } catch(err) {
                    showSaveNotification('导入失败：存档文件格式错误', 'error');
                } finally {
                    event.target.value = '';
                }
            };
            reader.readAsText(file);
        }

            });

            safeStorageRemove('genshinMathGame');
            gameState = { ...DEFAULT_GAME_STATE };
            gameState.lastDailyReset = new Date().toDateString();

        function checkDailyReset() {
            const today = new Date().toDateString();
            if (gameState.lastDailyReset !== today) {
                gameState.dailyQuests = dailyQuestTemplates.map(q => ({
                    ...q,
                    progress: 0,
                    completed: false,
                    claimed: false
                }));
                gameState.lastDailyReset = today;
                saveGameState();
            }
        }

        function updateUI() {
            document.getElementById('adventureRank').textContent = gameState.adventureRank;
            document.getElementById('moraCount').textContent = gameState.mora;
            document.getElementById('primogemCount').textContent = gameState.primogem;
            updateExpBar();
            checkConstellations();
            updateAchievementBadge();
        }

        function updateExpBar() {
            let ranksGained = 0;
            while (gameState.adventureRank < 999) {
                const requiredExp = gameState.adventureRank * 100;
                if (gameState.currentExp < requiredExp) break;
                gameState.currentExp -= requiredExp;
                gameState.adventureRank++;
                gameState.primogem += 50;
                ranksGained++;
            }

            const nextRankExp = gameState.adventureRank * 100;
            const progress = (gameState.currentExp / nextRankExp) * 100;
            document.getElementById('adventureRank').textContent = gameState.adventureRank;
            document.getElementById('primogemCount').textContent = gameState.primogem;
            document.getElementById('currentExp').textContent = gameState.currentExp;
            document.getElementById('nextRankExp').textContent = nextRankExp;
            document.getElementById('expProgress').style.width = `${Math.min(progress, 100)}%`;

            if (ranksGained > 0) {
                saveGameState();
                showRankUpNotification(ranksGained);
            }
        }

            const notification = document.createElement('div');

        function renderDayCard(day, nationColor, index, animate) {
            const isCompleted = gameState.completedDays.includes(day.day);
            const isUnlocked = day.day === 1 || gameState.completedDays.includes(day.day - 1) || isCompleted;

            const stars = starRecord ? starRecord.stars : 0;

            const el = ELEMENTS[character.element] || ELEMENTS.anemo;
            
            const difficultyClass = day.difficulty === 'basic' ? 'difficulty-basic' : 
                                    day.difficulty === 'advanced' ? 'difficulty-advanced' : 'difficulty-challenge';
            const difficultyText = day.difficulty === 'basic' ? '基础' : day.difficulty === 'advanced' ? '进阶' : '挑战';

        function getQuestionKey(q) {
            // Include every option: some题目 share the same stem but test different facts.
            const options = Array.isArray(q.options) ? [...q.options].map(String).sort().join('\u241f') : '';
            return `${q.q}\u241e${options}`;
        }

        function pickQuestionsForDay(day, count) {
            const rawQ = questionBank[day] || questionBank[1];
            const seen = gameState.seenQuestionKeys || {};
            const dayKey = 'day' + day;
            const seenSet = new Set(seen[dayKey] || []);

            // Split into unseen and seen questions
            const unseen = rawQ.filter(q => !seenSet.has(getQuestionKey(q)));
            const seenQs = rawQ.filter(q => seenSet.has(getQuestionKey(q)));

            // Keep one question per stem in a quiz. Several days contain variants
            // with the same wording but different option sets; showing both in one
            // run is confusing even though their persistent keys are distinct.
            const selected = [];
            const stems = new Set();
            for (const question of [...shuffleArray(unseen), ...shuffleArray(seenQs)]) {
                const stem = String(question.q).trim();
                if (stems.has(stem)) continue;
                stems.add(stem);
                selected.push(question);
                if (selected.length >= count) break;
            }

            // Remember these questions as seen
            if (!seen[dayKey]) seen[dayKey] = [];
            selected.forEach(q => {
                const key = getQuestionKey(q);
                if (!seen[dayKey].includes(key)) seen[dayKey].push(key);
            });
            // Keep seen list manageable (remember last 20 per day)
            if (seen[dayKey].length > 20) seen[dayKey] = seen[dayKey].slice(-20);
            gameState.seenQuestionKeys = seen;

            return selected.map(q => shuffleOptions(q));
        }

        function shuffleArray(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

            currentQuiz.wrongQuestionIndices = [];

            if (mode === 'revenge') {
                // Revenge mode: use wrong questions
                const wrongQs = gameState.wrongQuestions.map(w => ({
                    q: w.q, options: w.options, answer: w.answer,
                    difficulty: w.difficulty, explanation: w.explanation,
                    knowledgePoint: w.knowledgePoint, kpPage: w.kpPage,
                    day: w.day, _originalKey: w._key
                }));
                currentQuiz.questions = wrongQs.map(q => shuffleOptions(q));
            } else {
                // Normal mode: pick smart questions (unseen first, seen fill)

                let className = 'option-btn';

                }
                return `
                    <button class="${className}" onclick="selectOption(this, ${i})" ${answered ? 'disabled' : ''}>
                        <span class="font-bold mr-2" style="color: var(--primary-gold);">${labels[i]}.</span>

                        ${answered && i === currentQuiz.answers[currentQuiz.currentQuestion] && i !== q.answer ? '<i data-lucide="x" class="w-4 h-4 inline ml-2" style="color: #f44336;"></i>' : ''}

        function selectOption(btnEl, index) {
            if (currentQuiz.answers[currentQuiz.currentQuestion] !== undefined) return;

            const q = currentQuiz.questions[currentQuiz.currentQuestion];
            currentQuiz.answers[currentQuiz.currentQuestion] = index;
            gameState.totalAnswered++;

            const isCorrect = index === q.answer;
            const btn = btnEl;
            const rect = btn.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            
            if (isCorrect) {
                currentQuiz.correctCount++;
                currentQuiz.combo++;
                gameState.totalCorrect++;
                if (currentQuiz.combo > (gameState.bestCombo || 0)) {
                    gameState.bestCombo = currentQuiz.combo;
                }
                playCorrect();
                spawnParticles(cx, cy, '#4CAF50', 10);
                // Character happy reaction
                const portrait = document.getElementById('quizCharPortrait');
                if (portrait) {
                    portrait.classList.remove('char-sad', 'char-enter');
                    portrait.classList.add('char-happy');
                    setTimeout(() => portrait.classList.remove('char-happy'), 600);
                }
                // Spawn element-colored burst particles
                if (currentQuiz.mode !== 'revenge') {
                    const topic = dayTopics.find(t => t.day === currentQuiz.day);
                    if (topic && topic.char && topic.char.element) {
                        const eColor = (ELEMENTS[topic.char.element] || ELEMENTS.anemo).color;
                        spawnParticles(cx, cy, eColor, 6);
                    }
                }
                if (currentQuiz.combo >= 3) {
                    playCombo(currentQuiz.combo);
                    showComboPopup(currentQuiz.combo);
                    if (currentQuiz.combo >= 5) {
                        spawnParticles(cx, cy, '#FFD700', 8);
                    }
                }
                updateDailyQuestProgress('correctAnswer', 1);

                // If in revenge mode and got it right, remove from wrong book
                if (currentQuiz.mode === 'revenge' && q._originalKey) {
                    gameState.wrongQuestions = gameState.wrongQuestions.filter(
                        w => w._key !== q._originalKey
                    );
                    gameState.masteredQuestions.push({
                        _key: q._originalKey, q: q.q, masteredAt: Date.now()
                    });
                }
            } else {
                currentQuiz.combo = 0;
                currentQuiz.wrongQuestionIndices.push(currentQuiz.currentQuestion);
                playWrong();
                document.querySelector('.modal-content').classList.add('shake');
                setTimeout(() => document.querySelector('.modal-content').classList.remove('shake'), 500);
                // Character sad reaction
                const portrait = document.getElementById('quizCharPortrait');
                if (portrait) {
                    portrait.classList.remove('char-happy', 'char-enter');
                    portrait.classList.add('char-sad');
                    setTimeout(() => portrait.classList.remove('char-sad'), 500);
                }

                // Add to wrong questions book (avoid duplicates)
                const qKey = getQuestionKey(q);
                const existing = gameState.wrongQuestions.find(w => w._key === qKey);
                if (!existing) {
                    gameState.wrongQuestions.push({
                        _key: qKey,
                        day: currentQuiz.day || 0,
                        q: q.q,
                        options: q.options,
                        answer: q.answer,
                        difficulty: q.difficulty,
                        explanation: q.explanation,
                        knowledgePoint: q.knowledgePoint || '数学',
                        kpPage: q.kpPage || 'index.html',
                        wrongCount: 1,
                        lastWrong: Date.now()
                    });
                } else {
                    existing.wrongCount = (existing.wrongCount || 1) + 1;
                    existing.lastWrong = Date.now();
                }
            }
            
            updateExplanation(q, true);
            
            setTimeout(() => renderQuestion(), 100);
            // 每答完一题自动保存
            saveGameState();
            updateWrongBookBadge();
        }

        function prevQuestion() {
            playClick();
            if (currentQuiz.currentQuestion > 0) {
                currentQuiz.currentQuestion--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            playClick();
            const totalQ = currentQuiz.questions.length;
            if (currentQuiz.currentQuestion === totalQ - 1) {
                if (currentQuiz.answers[currentQuiz.currentQuestion] !== undefined) {
                    finishQuiz();
                }
            } else {
                currentQuiz.currentQuestion++;
                renderQuestion();
            }
        }

        function finishQuiz() {
            playStar();
            const totalQ = currentQuiz.questions.length;
            const correct = currentQuiz.correctCount;
            const wrong = totalQ - correct;
            const accuracy = correct / totalQ;
            const isRevenge = currentQuiz.mode === 'revenge';
            
            let stars = 1;
            if (accuracy >= 0.8) stars = 3;
            else if (accuracy >= 0.6) stars = 2;
            
            const comboBonus = Math.min(currentQuiz.combo * 5, 50);
            // Revenge mode: reduced rewards (no day completion bonuses)
            let expEarned, moraEarned, primogemEarned;
            if (isRevenge) {
                expEarned = Math.round((10 + correct * 5 + comboBonus) * 0.5);
                moraEarned = Math.round((100 + correct * 30 + comboBonus) * 0.5);
                primogemEarned = accuracy === 1 ? 5 : Math.floor(correct / 2);
            } else {
                expEarned = 20 + stars * 10 + comboBonus;
                moraEarned = 200 + stars * 100 + comboBonus * 2;
                primogemEarned = 5 + stars * 5 + (accuracy === 1 ? 10 : 0);
            }
            
            if (!isRevenge) {
                if (!gameState.completedDays.includes(currentQuiz.day)) {
                    gameState.completedDays.push(currentQuiz.day);
                    updateDailyQuestProgress('completeDay', 1);
                }
                
                const existingStar = gameState.starRecords.find(s => s.day === currentQuiz.day);
                const previousStars = existingStar ? existingStar.stars : 0;
                if (existingStar) {
                    if (stars > existingStar.stars) existingStar.stars = stars;
                } else {
                    gameState.starRecords.push({ day: currentQuiz.day, stars: stars });
                }
                
                if (stars === 3 && previousStars < 3) {
                    updateDailyQuestProgress('threeStar', 1);
                }
            }
            
            updateDailyQuestProgress('totalCorrect', correct);
            
            gameState.currentExp += expEarned;
            gameState.mora += moraEarned;
            gameState.primogem += primogemEarned;
            
            let newConstellation = null;
            if (!isRevenge) {
                const prevConstellations = [...gameState.unlockedConstellations];
                checkConstellations();
                newConstellation = constellations.find(c => 
                    !prevConstellations.includes(c.id) && gameState.unlockedConstellations.includes(c.id)
                );
            }
            
            saveGameState();
            
            document.getElementById('quizModal').classList.add('hidden');
            document.getElementById('resultModal').classList.remove('hidden');
            focusDialog('resultModal', false);
            
            // Set result character splash
            const resultSplash = document.getElementById('resultCharSplash');
            const resultBg = document.getElementById('resultModalBg');
            if (resultSplash && resultBg) {
                if (isRevenge) {
                    // Revenge mode - use a fire/national character
                    resultSplash.src = `${CHAR_CDN}hutao/gacha-splash`;
                    resultSplash.style.display = 'block';
                    resultSplash.onerror = function() { this.style.display='none'; };
                    resultBg.style.background = 'radial-gradient(ellipse at 20% 80%, rgba(239,122,53,0.15), transparent 60%)';
                } else {
                    const topic = dayTopics.find(t => t.day === currentQuiz.day);
                    if (topic && topic.char && topic.char.slug) {
                        const el = ELEMENTS[topic.char.element] || ELEMENTS.anemo;
                        resultSplash.src = `${CHAR_CDN}${topic.char.slug}/gacha-splash`;
                        resultSplash.style.display = 'block';
                        resultSplash.onerror = function() {
                            this.src = `${CHAR_CDN}${topic.char.slug}/portrait`;
                            this.onerror = function() { this.style.display='none'; };
                        };
                        resultBg.style.background = `radial-gradient(ellipse at 20% 80%, ${el.color}15, transparent 60%)`;
                    } else {
                        resultSplash.style.display = 'none';
                    }
                }
            }
            
            let dayTitle;
            if (isRevenge) {
                const remaining = gameState.wrongQuestions.length;
                dayTitle = `⚔️ 复仇模式 - ${remaining === 0 ? '全部攻克！' : `还剩${remaining}道错题`}`;
            } else {
                const topic = dayTopics.find(t => t.day === currentQuiz.day);
                dayTitle = `Day ${currentQuiz.day} - ${topic.title}`;
            }
            document.getElementById('resultDay').textContent = dayTitle;
            document.getElementById('correctCount').textContent = correct;
            document.getElementById('accuracy').textContent = Math.round(accuracy * 100) + '%';
            document.getElementById('earnedExp').textContent = expEarned;
            document.getElementById('earnedMora').textContent = '+' + moraEarned;
            document.getElementById('earnedPrimogem').textContent = '+' + primogemEarned;
            
            const starContainer = document.getElementById('starRating');
            // Hide stars in revenge mode if not perfect
            if (isRevenge && accuracy < 1) {
                starContainer.innerHTML = `<div class="text-sm py-2" style="color:var(--text-secondary)">继续加油，征服错题！</div>`;
            } else {
                starContainer.innerHTML = [1,2,3].map((i, idx) => 
                    `<i data-lucide="star" class="w-10 h-10 ${i <= stars ? 'star fill-current star-pop' : 'star empty'}" style="animation-delay: ${idx * 0.2}s; opacity: 0;"></i>`
                ).join('');
                if (stars >= 1) {
                    setTimeout(() => spawnParticles(window.innerWidth/2, window.innerHeight/2 - 100, '#FFD700', 20), 300);
                }
            }
            
            const newAchDiv = document.getElementById('newAchievement');
            if (newConstellation) {
                newAchDiv.classList.remove('hidden');
                document.getElementById('achievementText').textContent = `解锁命之座：${newConstellation.name}`;
            } else {
                newAchDiv.classList.add('hidden');
            }

            // Wrong question summary
            const wrongDiv = document.getElementById('wrongSummary');
            if (wrong > 0) {
                wrongDiv.classList.remove('hidden');
                document.getElementById('wrongCountText').textContent = wrong;
            } else {
                wrongDiv.classList.add('hidden');
            }
            
            lucide.createIcons();
            updateUI();
            updateWrongBookBadge();
        }

        let confirmResolver = null;
        function themedConfirm(opts) {
            const { title = '确认操作', message = '', confirmText = '确定', cancelText = '取消', danger = false } = opts || {};
            return new Promise(resolve => {
                confirmResolver = resolve;
                document.getElementById('confirmTitle').textContent = title;
                document.getElementById('confirmMessage').textContent = message;
                const okBtn = document.getElementById('confirmOkBtn');
                okBtn.textContent = confirmText;
                document.getElementById('confirmCancelBtn').textContent = cancelText;
                okBtn.style.background = danger
                    ? 'linear-gradient(135deg, #F44336, #B71C1C)'
                    : 'linear-gradient(135deg, #C8A95B, #9A7B3F)';
                document.getElementById('confirmModal').classList.remove('hidden');
                lucide.createIcons();
                setTimeout(() => okBtn.focus(), 60);
            });
        }

        function resolveConfirm(result) {
            const modal = document.getElementById('confirmModal');
            if (!modal || modal.classList.contains('hidden')) return;
            modal.classList.add('hidden');
            if (confirmResolver) {
                const resolver = confirmResolver;
                confirmResolver = null;
                playClick();
                resolver(result);
            }
        }

        async function closeQuiz() {
            const quit = await themedConfirm({
                title: '退出挑战',
                message: '确定要退出挑战吗？当前进度将不会保存。',
                confirmText: '退出挑战',
                cancelText: '继续答题'
            });
            if (!quit) return;
            document.getElementById('quizModal').classList.add('hidden');
            resetCurrentQuiz();
            restoreDialogFocus();
        }

        function closeResult() {
            playClick();
            document.getElementById('resultModal').classList.add('hidden');
            const wasRevenge = currentQuiz.mode === 'revenge';
            const lastDay = currentQuiz.day;
            resetCurrentQuiz();
            renderCalendar();
            if (wasRevenge) {
                switchTab('wrongbook');
            }
            restoreDialogFocus();
        }

        function resetCurrentQuiz() {
            currentQuiz = { day: null, currentQuestion: 0, answers: [], questions: [], correctCount: 0, combo: 0, shuffledQuestions: [], mode: 'normal', wrongQuestionIndices: [] };
        }

        function retryQuiz() {
            playClick();
            document.getElementById('resultModal').classList.add('hidden');
            if (currentQuiz.mode === 'revenge') {
                startRevengeMode();
            } else {
                startQuiz(currentQuiz.day);
            }
        }

        function updateWrongBookBadge() {
            const badge = document.getElementById('wrongBookBadge');
            if (!badge) return;
            const count = gameState.wrongQuestions.length;
            if (count > 0) {
                badge.textContent = count > 99 ? '99+' : count;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function startRevengeMode() {
            playClick();
            if (gameState.wrongQuestions.length === 0) {
                showSaveNotification('错题本是空的，太棒了！', 'success');
                return;
            }
            // Sort by wrongCount desc, lastWrong desc
            const sorted = [...gameState.wrongQuestions].sort((a, b) => {
                if ((b.wrongCount||1) !== (a.wrongCount||1)) return (b.wrongCount||1) - (a.wrongCount||1);
                return (b.lastWrong||0) - (a.lastWrong||0);
            });
            // Take up to 10 wrong questions
            const selected = sorted.slice(0, Math.min(10, sorted.length));
            // Set currentQuiz for revenge
            currentQuiz.day = 0;
            currentQuiz.mode = 'revenge';
            currentQuiz.currentQuestion = 0;
            currentQuiz.answers = [];
            currentQuiz.combo = 0;
            currentQuiz.correctCount = 0;
            currentQuiz.wrongQuestionIndices = [];
            currentQuiz.questions = selected.map(w => shuffleOptions({
                q: w.q, options: [...w.options], answer: w.answer,
                difficulty: w.difficulty, explanation: w.explanation,
                knowledgePoint: w.knowledgePoint, kpPage: w.kpPage,
                _originalKey: w._key, day: w.day
            }));

            document.getElementById('comboDisplay').classList.add('hidden');
            document.getElementById('quizTitle').textContent = `⚔️ 复仇模式 - 错题反攻 (${currentQuiz.questions.length}题)`;
            document.getElementById('resultModal').classList.add('hidden');
            document.getElementById('quizModal').classList.remove('hidden');
            focusDialog('quizModal');
            const modal = document.querySelector('#quizModal .modal-content');
            modal.classList.add('question-enter');
            setTimeout(() => modal.classList.remove('question-enter'), 300);
            renderQuestion();
        }

        async function clearWrongBook() {
            if (gameState.wrongQuestions.length === 0) {
                showSaveNotification('错题本已经是空的', 'info');
                return;
            }
            const doClear = await themedConfirm({
                title: '清空错题本',
                danger: true,
                confirmText: '清空',
                message: `确定清空错题本吗？将删除 ${gameState.wrongQuestions.length} 道错题记录。`
            });
            if (!doClear) return;
            gameState.wrongQuestions = [];
            saveGameState();
            renderWrongBook();
            updateWrongBookBadge();
            showSaveNotification('错题本已清空', 'success');
        }

        function renderWrongBook() {
            const container = document.getElementById('wrongBookList');
            const wrongs = gameState.wrongQuestions;
            if (wrongs.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16">
                        <i data-lucide="check-circle-2" class="w-16 h-16 mx-auto mb-4" style="color:#4CAF50;"></i>
                        <h3 class="text-xl font-bold mb-2" style="color:var(--primary-gold-light);">没有错题！</h3>
                        <p style="color:var(--text-secondary);">继续保持，你是数学天才！</p>
                    </div>`;
                lucide.createIcons();
                return;
            }

            // Group by knowledge point
            const grouped = Object.create(null);
            wrongs.forEach(w => {
                const kp = w.knowledgePoint || '其他';
                if (!grouped[kp]) grouped[kp] = [];
                grouped[kp].push(w);
            });

            let html = '';
            const diffColors = { basic: '#4CAF50', advanced: '#FF9800', challenge: '#F44336' };
            const diffNames = { basic: '基础', advanced: '进阶', challenge: '挑战' };

            Object.keys(grouped).forEach(kp => {
                const items = grouped[kp];
                const kpPage = items[0].kpPage || 'index.html';
                html += `<div class="mb-4 p-4 rounded-lg" style="background: rgba(20,15,40,0.6); border: 1px solid var(--border-color);">
                    <div class="flex items-center justify-between mb-3">
                        <h4 class="font-bold flex items-center gap-2" style="color:var(--primary-gold-light);">
                            <i data-lucide="book-open" class="w-4 h-4"></i>${escapeHtml(kp)}
                            <span class="text-xs px-2 py-0.5 rounded-full" style="background:rgba(244,67,54,0.2);color:#F44336;">${items.length}题</span>
                        </h4>
                        <a href="${escapeHtml(kpPage)}" target="_blank" rel="noopener" class="text-xs px-3 py-1.5 rounded-lg transition hover:brightness-125 inline-flex items-center gap-1" style="background:linear-gradient(135deg,rgba(76,194,240,0.15),rgba(76,194,240,0.05));border:1px solid rgba(76,194,240,0.3);color:#4CC2F0;">
                            <i data-lucide="book-marked" class="w-3 h-3"></i>复习知识点
                        </a>
                    </div>
                    <div class="space-y-2">`;
                items.forEach((w, idx) => {
                    const wrongTimes = w.wrongCount || 1;
                    const dayLabel = w.day > 0 ? `Day${w.day}` : '复习';
                    html += `<div class="p-3 rounded-lg" style="background:rgba(0,0,0,0.3);border-left:3px solid ${diffColors[w.difficulty]||'#F44336'};">
                        <div class="flex items-start justify-between gap-2 mb-2">
                            <span class="text-xs px-2 py-0.5 rounded" style="background:${diffColors[w.difficulty]||'#F44336'}22;color:${diffColors[w.difficulty]||'#F44336'};">${diffNames[w.difficulty]||'基础'} · ${dayLabel}</span>
                            <span class="text-xs" style="color:var(--text-secondary);">错${wrongTimes}次</span>
                        </div>
                        <p class="text-sm mb-2" style="color:var(--text-primary);">${escapeHtml(w.q)}</p>
                        <details class="text-xs">
                            <summary style="color:var(--primary-gold);cursor:pointer;" class="hover:brightness-125">查看解析 ▾</summary>
                            <div class="mt-2 p-2 rounded" style="background:rgba(76,194,161,0.08);color:var(--text-secondary);line-height:1.6;">
                                <p style="color:#4CAF50;margin-bottom:4px;">正确答案：${String.fromCharCode(65 + w.answer)}. ${escapeHtml(w.options[w.answer])}</p>
                                <p>${escapeHtml(w.explanation)}</p>
                            </div>
                        </details>
                    </div>`;
                });
                html += '</div></div>';
            });

            container.innerHTML = html;
            lucide.createIcons();
        }

        function updateDailyQuestProgress(type, amount) {
            gameState.dailyQuests.forEach(quest => {
                if (quest.type === type && !quest.completed) {
                    quest.progress += amount;
                    if (quest.progress >= quest.target) {
                        quest.progress = quest.target;
                        quest.completed = true;
                    }
                }
            });
            saveGameState();
        }

        function claimQuestReward(questId) {
            const quest = gameState.dailyQuests.find(q => q.id === questId);
            if (quest && quest.completed && !quest.claimed) {
                quest.claimed = true;
                gameState.mora += quest.reward.mora;
                gameState.primogem += quest.reward.primogem;
                saveGameState();
                updateUI();
                renderDailyQuests();
            }
        }

        function showAchievements() {
            document.getElementById('achievementModal').classList.remove('hidden');
            focusDialog('achievementModal');
            const list = document.getElementById('achievementList');
            list.innerHTML = constellations.map(c => {
                const isUnlocked = gameState.unlockedConstellations.includes(c.id);
                return `
                    <div class="flex items-center gap-4 p-3 rounded-lg ${isUnlocked ? '' : 'opacity-50'}"
                         style="background: ${isUnlocked ? 'rgba(168, 90, 245, 0.1)' : 'rgba(50,50,50,0.2)'};">
                        <div class="w-12 h-12 rounded-full flex items-center justify-center"
                             style="background: ${isUnlocked ? 'var(--inazuma)' : '#444'};">
                            <i data-lucide="award" class="w-6 h-6 ${isUnlocked ? 'text-white' : 'text-gray-500'}"></i>
                        </div>
                        <div class="flex-1">
                            <p class="font-bold" style="color: ${isUnlocked ? 'var(--primary-gold-light)' : '#888'};">${c.name}</p>
                            <p class="text-sm" style="color: var(--text-secondary);">${c.desc}</p>
                        </div>
                        <div class="text-right">
                            ${isUnlocked ? 
                                '<span style="color: #4CAF50; font-size: 12px;">已达成</span>' : 
                                '<span style="color: #888; font-size: 12px;">未达成</span>'}
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        function closeAchievements() {
            document.getElementById('achievementModal').classList.add('hidden');
            restoreDialogFocus();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedSound = safeStorageGet('genshinMathSound');
            if (savedSound !== null) soundEnabled = savedSound === 'true';
            syncSoundToggle();
            
            loadGameState();
            renderCalendar();
            updateWrongBookBadge();
            lucide.createIcons();
            
            requestAnimationFrame(() => {
                setTimeout(() => {
                    const overlay = document.getElementById('loadingOverlay');
                    if (overlay) overlay.classList.add('hidden');
                }, 300);
            });
            
            document.addEventListener('click', () => initAudio(), { once: true });

            // 页面关闭/刷新/切换前自动保存
            window.addEventListener('beforeunload', () => saveGameState());
            window.addEventListener('pagehide', () => saveGameState());
            // 定期自动保存（每30秒）
            setInterval(saveGameState, 30000);
        });

        document.addEventListener('keydown', event => {
            if (event.key === 'Tab') {
                trapDialogFocus(event);
                return;
            }
            if (event.key !== 'Escape') return;
            const confirmModal = document.getElementById('confirmModal');
            if (confirmModal && !confirmModal.classList.contains('hidden')) {
                resolveConfirm(false);
                return;
            }
            const saveMenu = document.getElementById('saveMenuOverlay');
            if (saveMenu) {
                closeSaveMenu();
            } else if (!document.getElementById('achievementModal').classList.contains('hidden')) {
                closeAchievements();
            } else if (!document.getElementById('resultModal').classList.contains('hidden')) {
                closeResult();
            } else if (!document.getElementById('quizModal').classList.contains('hidden')) {
                closeQuiz();
            }
        });
    </script>
    <script src="assets/genshin-enhancements.js"></script>
</body>
</html>
